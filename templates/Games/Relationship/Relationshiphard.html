<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Sequence</title>
    <style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(45deg, #4e54c8, #8e2de2);

            color: #fff;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            box-shadow: 0px 10px 20px rgba(0, 0, 0, 0.5);
            padding: 30px;
            width: 90%;
            max-width: 800px;
            position: relative;
        }

        .timer {
            font-size: 1.2rem;
            font-weight: bold;
            background: #4caf50;
            padding: 10px 20px;
            border-radius: 8px;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .question {
            font-size: 1.8rem;
            margin-top: 60px;
            margin-bottom: 30px;
        }

        .options {
            display: flex;
            justify-content: space-around;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option {
            padding: 15px 20px;
            font-size: 1.3rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #4e54c8;
            color: white;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .option:hover {
            transform: scale(1.05);
            background: #8e2de2;
        }
        .result {
            font-size: 1.5rem;
            margin-top: 20px;
            display: none;
        }

        .result.correct {
            color: #4caf50;
            font-size: 2rem;
        }

        .result.wrong {
            color: #f44336;
            font-size: 2rem;

        }

        .result-box {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, #6a11cb, #2575fc); /* Purple gradient */
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6), 0 0 50px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            color: white;
            opacity: 0;
            animation: popIn 0.6s ease forwards;
            width: 80%;
            max-width: 500px;
            animation-delay: 0.5s;
        }
        
        @keyframes popIn {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.6);
            }
            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }
        
        .result-box h1 {
            font-size: 2.2rem;
            margin-bottom: 15px; /* Reduced margin to make it closer to text */
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.6);
        }
        
        .result-box p {
            font-size: 1.5rem;
            margin-bottom: 40px; /* Increased margin to create space between text and button */
            color: #f5f5f5;
            font-weight: 600;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 0, 0, 0.4);
        }
        
        .restart-button {
            padding: 15px 30px;
            font-size: 1.4rem;
            cursor: pointer;
            background: linear-gradient(145deg, #ff4081, #f50057); /* Pink gradient for button */
            border: none;
            border-radius: 50px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: absolute;
            left: 50%;
            bottom: 15px;
            transform: translateX(-50%);
            color: white;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.6);
            outline: none;
            margin-top: 20px; /* Adds space between the button and the text above */
        }
        
        .restart-button:hover {
            background: linear-gradient(145deg, #ff80ab, #f50057); /* Lighter pink hover effect */
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        
        .restart-button:focus {
            outline: none;
        }
        
        
        @keyframes slideLeft {
            0% {
                left: 50%;
            }
            100% {
                left: 10%;
            }
        }
        .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 15px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
    </style>
</head>
<body>

  <button class="back-button" onclick="goBack()">← Back</button>

    <div class="game-container">
        <div class="timer" id="timer">60</div>
        <div class="question" id="question">A woman says, "My mother’s husband is my father’s son’s father-in-law." How is the woman related to the father-in-law?</div>
        <div class="options" id="options">
            <button class="option" onclick="checkAnswer('A')">A. Sister-in-law</button>
            <button class="option" onclick="checkAnswer('B')">B. Granddaughter</button>
            <button class="option" onclick="checkAnswer('C')">C. Daughter</button>
            <button class="option" onclick="checkAnswer('D')">D. Niece</button>
        </div>
        <div class="result" id="result"></div>
        <div class="next-message" id="nextMessage" style="display: none;">Next question loading...</div>
    </div>

    <!-- Result Box -->
    <div class="result-box" id="resultBox">
        <h1 id="resultComment"></h1>
        <p id="finalScore"></p>
        <button class="restart-button" id="restartButton" onclick="restartGame()">Restart</button>
    </div>

    <script>
        const questions = [
            { text: 'A woman says, "My mother’s husband is my father’s son’s father-in-law." How is the woman related to the father-in-law?', correct: 'B', options: ['Sister-in-law', 'Granddaughter', 'Daughter', 'Niece'] },
            { text: 'A man’s father is the brother of your aunt. How is the man related to you?', correct: 'D', options: ['Nephew', 'Uncle', 'Brother', 'Cousin'] },
            { text: 'A woman’s uncle has a daughter. What is the woman’s relationship to the daughter of her uncle’s wife?', correct: 'A', options: ['Cousin', 'Sister', 'Niece', 'Sister-in-law'] },
            { text: 'If a man’s daughter’s brother is his son, and his son is married to a woman who has no siblings, what is the woman’s relationship to the man?', correct: 'C', options: ['Mother-in-law', 'Sister-in-law', 'Daughter-in-law', 'Niece'] },
            { text: 'Your uncle’s daughter’s daughter is your cousin’s daughter. What is the cousin’s daughter to your father?', correct: 'B', options: ['Granddaughter', 'Great-niece', 'Cousin', 'Niece'] },
            { text: 'Your father’s sister is married to your uncle. What is your uncle’s daughter to your father?', correct: 'C', options: ['Sister-in-law', 'Daughter', 'Niece', 'Cousin'] },
            { text: 'A man says, “I am the son of my mother’s sister’s son.” How is the man related to his mother’s sister’s son?', correct: 'A', options: ['Cousin', 'Father', 'Brother', 'Nephew'] },
            { text: 'If a woman’s brother is the father of her daughter’s husband, what is the woman’s relationship to her daughter’s husband?', correct: 'A', options: ['Mother-in-law', 'Grandmother', 'Aunt', 'Sister'] },
            { text: 'A woman says, “My uncle’s son is married to my cousin’s daughter.” What is the woman’s relationship to her cousin’s daughter?', correct: 'C', options: ['Cousin', 'Niece', 'Aunt', 'Sister-in-law'] },
            { text: 'A man says, “The daughter of my father’s brother is married to the son of my father’s sister.” What is the relationship between the man and the woman’s children?', correct: 'D', options: ['Nephews', 'Uncles', 'Siblings', 'Cousins'] },
            { text: 'A man’s father’s wife’s son is his brother. If the brother has a son, what is the brother’s son to the man?', correct: 'A', options: ['Nephew', 'Brother', 'Son', 'Cousin'] },
            { text: 'If your father’s brother’s daughter is your cousin, what is her son’s relationship to your father?', correct: 'A', options: ['Grandson', 'Cousin', 'Son-in-law', 'Nephew'] },
            { text: 'Your mother’s sister’s son has a daughter. What is the daughter to you?', correct: 'C', options: ['Granddaughter', 'Cousin', 'Second cousin', 'Niece'] },
            { text: 'If your aunt is the sister of your mother and your aunt has a son who is younger than your daughter, what is your relationship to your aunt’s son?', correct: 'D', options: ['Father', 'Brother', 'Nephew', 'Cousin'] },
            { text: 'A man says, "The brother of my father is my uncle’s son’s father-in-law." Who is the man to the uncle’s son’s father-in-law?', correct: 'A', options: ['Cousin', 'Nephew', 'Brother-in-law', 'Son'] },
            { text: 'If your father’s brother has a daughter, what is that daughter’s relationship to your mother?', correct: 'D', options: ['Daughter-in-law', 'Cousin', 'Niece', 'Sister-in-law'] },
            { text: 'Your father’s sister’s daughter is your cousin. What is her son to your father?', correct: 'B', options: ['Cousin', 'Grandson', 'Nephew', 'Son-in-law'] },
            { text: 'A woman’s son’s son is married to her brother’s daughter. What is the woman’s relationship to her brother’s daughter?', correct: 'A', options: ['Mother-in-law', 'Niece', 'Sister-in-law', 'Aunt'] },
            { text: 'A man says, "My sister’s daughter’s husband is my cousin." How is the man related to the cousin?', correct: 'C', options: ['Father', 'Nephew', 'Uncle', 'Brother'] },
            { text: 'A man’s father is the brother of his aunt’s husband. How is the man related to his aunt’s husband?', correct: 'D', options: ['Brother', 'Son', 'Cousin', 'Nephew'] },
            { text: 'A man’s mother’s sister is married to his uncle. What is the man’s relationship to his uncle’s daughter?', correct: 'A', options: ['Cousin', 'Aunt', 'Sister', 'Niece'] },
            { text: 'Your father’s sister’s daughter is your cousin. What is her son to your father?', correct: 'B', options: ['Nephew', 'Grandson', 'Cousin', 'Son-in-law'] },
            { text: 'A woman’s son’s son is married to her brother’s daughter. What is the woman’s relationship to her brother’s daughter?', correct: 'D', options: ['Niece', 'Sister-in-law', 'Aunt', 'Mother-in-law'] },
            { text: 'A man says, “My sister’s daughter’s husband is my cousin.” What is the man’s relationship to the cousin’s father-in-law?', correct: 'B', options: ['Brother-in-law', 'Cousin', 'Son', 'Nephew'] },
            { text: 'A man’s father is the brother of his aunt’s husband. How is the man related to his aunt’s husband?', correct: 'C', options: ['Brother', 'Son', 'Nephew', 'Cousin'] },
            ];
            let currentQuestion = 0;
            let score = 0;
            let timeLeft = 60;
            let timer;
    
            function startTimer() {
                const timerElement = document.getElementById('timer');
                timer = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        timerElement.textContent = timeLeft;
                    } else {
                        clearInterval(timer);
                        checkAnswer(null, true); // Trigger timeout action
                    }
                }, 1000);
            }
    
            function loadQuestion() {
                const questionElement = document.getElementById('question');
                const optionsElement = document.getElementById('options');
                const resultElement = document.getElementById('result');
                const nextMessage = document.getElementById('nextMessage');
    
                const question = questions[currentQuestion];
                questionElement.textContent = question.text;
    
                resultElement.style.display = 'none';
                nextMessage.style.display = 'none';
    
                loadOptions(question.options);
    
                timeLeft = 60;
                startTimer();
            }
    
            function loadOptions(options) {
                const optionsElement = document.getElementById('options');
                optionsElement.innerHTML = options
                    .map((option, index) => `<button class="option" onclick="checkAnswer('${String.fromCharCode(65 + index)}')">${String.fromCharCode(65 + index)}. ${option}</button>`)
                    .join('');
            }
    
    
            
            function checkAnswer(selected, isTimeout = false) {
                clearInterval(timer);
                const resultElement = document.getElementById('result');
                const nextMessage = document.getElementById('nextMessage');
                const correct = questions[currentQuestion].correct;
            
                if (isTimeout) {
                    resultElement.textContent = `Time Up! The correct answer was ${correct}.`;
                    resultElement.className = 'result wrong';
                } else if (selected === correct) {
                    resultElement.textContent = 'Correct!';
                    resultElement.className = 'result correct';
                    score++;
                } else {
                    resultElement.textContent = `Wrong! The correct answer was ${correct}.`;
                    resultElement.className = 'result wrong';
                }
            
                resultElement.style.display = 'block';
                nextMessage.style.display = 'block';
            
                setTimeout(nextQuestion, 3000); // Automatically load the next question
            }
            
            function nextQuestion() {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    loadQuestion();
                } else {
                    showFinalResult();
                }
            }
            
    
            function showFinalResult() {
                const resultBox = document.getElementById('resultBox');
                const resultComment = document.getElementById('resultComment');
                const finalScore = document.getElementById('finalScore');
    
                let comment;
                if (score === 25) {
                    comment = 'You are a god! You scored 25 out of 25!';
                } else if (score > 20) {
                    comment = `Amazing! Your score: ${score}`;
                } else if (score >= 15) {
                    comment = `You are good! Your score: ${score}`;
                } else if (score >= 10) {
                    comment = `Could do better! Your score: ${score}`;
                } else {
                    comment = `Better luck next time! Your score: ${score}`;
                }
    
                resultComment.textContent = comment;
                finalScore.textContent = `Final Score: ${score} / ${questions.length}`;
    
                resultBox.style.display = 'block';
    
                // Center restart button initially
                const restartButton = document.getElementById('restartButton');
                restartButton.style.display = 'block';
    
                setTimeout(() => {
                    restartButton.classList.add('restart-left');
                }, 5000);
            }
    
            function restartGame() {
                score = 0;
                currentQuestion = 0;
                loadQuestion();
                document.getElementById('resultBox').style.display = 'none';
            }
    
            // Initial call
            loadQuestion();

            function goBack() {
      window.location.href = "{{ url_for('relations') }}"; // Change "index.html" to your desired page
    }
        </script>
    </body>
    </html>
