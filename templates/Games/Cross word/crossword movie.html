<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #FF8C00, #6A5ACD);
            color: #fff;
        }

        h1 {
            margin-top: 20px;
            font-size: 2em;
            color: yellow;
        }
        .crossword-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(17, 40px); /* 16 columns */
            grid-template-rows: repeat(19, 40px); /* 15 rows */
            gap: 2px;
            border: 3px solid #ff0;
            box-shadow: 0 0 10px 5px #ff0;
        }

        .cell {
      position: relative;
      width: 40px;
      height: 40px;
      border: 1px solid #8B4513;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #FFE4B5; /* Moccasin */
    }

    .cell input {
      width: 100%;
      height: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      border: none;
      outline: none;
      background-color: transparent;
      color: #2c3e50;
    }

    .subscript {
      font-size: 0.6em;
      color: #8B4513;
      position: absolute;
      top: 2px;
      left: 2px;
    }

    .black {
      background-color: #2c3e50;
    }

    .clues-container {
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    .clues {
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
      background: #F0E68C; /* Khaki */
      padding: 10px;
      border-radius: 10px;
    }

    .clues h2 {
      color: #8B4513;
      font-size: 1.5em;
      margin-top: 0;
    }

    .clues ul {
      list-style-type: none;
      padding-left: 0;
      color: #333;
      font-size: 1.1em;
    }

    .clues li {
      margin-bottom: 12px;
      line-height: 1.4;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #FF8C00; /* Dark orange */
      border: none;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 4px #E67E22; /* Carrot */
      transition: background 0.3s, transform 0.3s;
    }

    button:hover {
      background-color: #E67E22; /* Carrot */
      transform: translateY(-2px);
    }

    button:active {
      box-shadow: 0 2px #D35400; /* Pumpkin */
      transform: translateY(2px);
    }

    .status-message {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #2ecc71;
    }
    .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 15px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
  </style>
</head>
<body>

  <button class="back-button" onclick="goBack()">← Back</button>


    <h1>Movies</h1>

    <div class="crossword-container">
        <div class="grid"></div>
        <div class="clues">
          <h2>Across</h2>
          <ul id="across-clues"></ul>
          <h2>Down</h2>
          <ul id="down-clues"></ul>
        </div>

    <button onclick="checkCompletion()">Submit Puzzle</button>

    <div class="status-message" id="status-message"></div>

    <script>
        const crosswordData = {
            grid: [
                ['','','','','T','','','','','','','','','','','',''],
                ['V','I','K','R','A','M','','','','L','','','C','','','',''],
                ['','','G','','A','','','','','O','','','H','','','',''],
                ['','','F','','R','','','','','V','','','I','','R','',''],
                ['','','','','E','E','G','A','','E','','','N','','A','',''],
                ['R','','','','Z','','','','','M','','','N','','N','',''],
                ['A','','','','A','','','','','O','','','A','','G','',''],
                ['A','','','','M','','7','7','7','C','H','A','R','L','I','E',''],
                ['J','','','','E','','','','','K','','','I','','T','',''],
                ['A','','','','E','','','','','T','','','M','','A','',''],
                ['K','','K','A','N','T','H','A','R','A','','','U','','R','',''],
                ['U','','','','P','','','','','I','','','T','','A','',''],
                ['M','U','N','G','A','R','U','M','A','L','E','','H','','N','',''],
                ['A','','','','R','','P','','','','','','A','','G','',''],
                ['R','R','R','','','','E','','','','','','','','A','',''],
                ['A','','','','','','N','','','','','','','','','',''],
                ['','','','','A','N','D','H','A','D','H','U','N','','','',''],
                ['','','','','','','R','','','','','','','','','',''],
                ['','','','','','G','A','N','D','H','A','D','A','G','U','D','I']
            ],
            clues: {
        across: [
          { number: 2, clue: "A masked vigilante uncovers a drug empire while cooking for his family.", answer: "VIKRAM", row: 1, col: 0 },
          { number: 7, clue: "Revenge takes the form of a tiny insect in this high-flying movie.", answer: "EEGA", row: 4, col: 4 },
          { number: 9, clue: "A heartwarming tale of a man and his loyal dog that teaches us about companionship and overcoming grief.", answer: "777CHARLIE", row: 7, col: 6 },
          { number: 10, clue: "A story set in a village where a sacred grove and divine traditions are under threat.", answer: "KANTHARA", row: 10, col: 2 },
          { number: 11, clue: "The journey of a heartbroken man who finds solace in the rains and a beautiful hill station.", answer: "MUNGARUMALE", row: 12, col: 0 },
          { number: 13, clue: "A British officer's friendship with a tribal hero ends with a flaming revolt.", answer: "RRR", row: 14, col: 0 },
          { number: 14, clue: "A blind pianist gets entangled in a murder mystery in this thrilling comedy-drama.", answer: "ANDHADHUN", row: 16, col: 4 },
          { number: 15, clue: "Set in the serene forests of Karnataka, this story beautifully captures the harmony between humans and wildlife, emphasizing environmental conservation.", answer: "GANDHADAGUDI", row: 18, col: 5 }
        ],
        down: [
          { number: 1, clue: "A heartfelt story of a boy who struggles with letters and numbers, but his unique artistic talent shines through when he finds the right guidance.", answer: "TAAREZAMEENPAR", row: 0, col: 4 },
          { number: 3, clue: "A tale of a village deeply connected to a sacred gold mine, depicting the struggles and aspirations of its people amidst the backdrop of greed and power.", answer: "KGF", row: 1, col: 2 },
          { number: 4, clue: "A journey that begins with the protagonist fleeing from a life of loneliness, discovering love and healing in the beauty of Karnataka’s coastal landscapes.", answer: "LOVEMOCKTAIL", row: 1, col: 9 },
          { number: 5, clue: "A thrilling story about a young boy who dreams of becoming a cricket star despite many hurdles.", answer: "CHINNARIMUTHA", row: 1, col: 12 },
          { number: 6, clue: "Set in a mystical forest, this action-packed film weaves a gripping tale of lost treasure and ancient legends.", answer: "RANGITARANGA", row: 3, col: 14 },
          { number: 8, clue: "A man returns to his roots to honor his family and help people in his hometown.", answer: "RAAJAKUMARA", row: 5, col: 0 },
          { number: 12, clue: "Known for its unique storytelling, this film explores a man’s life from a metaphysical and philosophical lens, questioning 'Who Am I?'", answer: "UPENDRA", row: 12, col: 6 },
        ], // Moved inside clues
    },
};

// DOM elements
const crosswordGrid = document.querySelector(".grid");
const acrossClues = document.querySelector("#across-clues");
const downClues = document.querySelector("#down-clues");
const statusMessage = document.querySelector("#status-message");

// Create the grid based on crosswordData
function createGrid() {
  crosswordData.grid.forEach((row, rowIndex) => {
    row.forEach((cell, colIndex) => {
      const cellDiv = document.createElement("div");
      cellDiv.classList.add("cell");

      if (cell) {
        const input = document.createElement("input");
        input.maxLength = 1;
        input.dataset.row = rowIndex;
        input.dataset.col = colIndex;
        input.addEventListener("input", handleInput);
        cellDiv.appendChild(input);

        const clueNumber = getClueNumber(rowIndex, colIndex);
        if (clueNumber) {
          const subscript = document.createElement("span");
          subscript.classList.add("subscript");
          subscript.textContent = clueNumber;
          cellDiv.appendChild(subscript);
        }
      } else {
        cellDiv.classList.add("black");
      }

      crosswordGrid.appendChild(cellDiv);
    });
  });
}

// Get clue number for a cell
function getClueNumber(row, col) {
  const acrossClue = crosswordData.clues.across.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (acrossClue) return acrossClue.number;

  const downClue = crosswordData.clues.down.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (downClue) return downClue.number;

  return '';
}

// Create clues list
function createClues() {
  crosswordData.clues.across.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    acrossClues.appendChild(clueItem);
  });

  crosswordData.clues.down.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    downClues.appendChild(clueItem);
  });
}

// Handle input and move to next cell
function handleInput(event) {
  const input = event.target;
  input.value = input.value.toUpperCase();

  let nextInput;
  if (input.value.match(/[A-Z]/)) {
    nextInput = getNextInput(input);
    if (nextInput) {
      nextInput.focus();
    }
  }
}

// Determine next input field
function getNextInput(input) {
  const row = parseInt(input.dataset.row);
  const col = parseInt(input.dataset.col);

  // Determine if the cell is part of an across or down word
  const isAcross = crosswordData.clues.across.some(
    (clue) => clue.row === row && clue.col <= col && clue.col + clue.answer.length > col
  );

  if (isAcross) {
    return document.querySelector(`input[data-row="${row}"][data-col="${col + 1}"]`);
  } else {
    return document.querySelector(`input[data-row="${row + 1}"][data-col="${col}"]`);
  }
}

// Check if the puzzle is completed correctly
function checkCompletion() {
  let allCorrect = true;

  // Check across words
  crosswordData.clues.across.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row}"][data-col="${clue.col + i}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Check down words
  crosswordData.clues.down.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row + i}"][data-col="${clue.col}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Display result
  if (allCorrect) {
    statusMessage.textContent = "Fantastic! You've completed the crossword!";
    statusMessage.style.color = "#00ff00"; // Green
  } else {
    statusMessage.textContent = "Some answers are incorrect. Keep trying!";
    statusMessage.style.color = "#ff0000"; // Red
  }
}

// Initialize the crossword
createGrid();
createClues();

function goBack() {
      window.location.href = "{{ url_for('crossword2ndpage') }}"; // Change "index.html" to your desired page
    }
</script>

</body>
</html>
