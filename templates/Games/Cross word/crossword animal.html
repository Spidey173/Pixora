<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Crossword Puzzle Game</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #C0C0C0, #8B4513);
            color: #fff;
        }

        h1 {
            margin-top: 20px;
            font-size: 2em;
            color: yellow;
        }
        .crossword-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            align-items: center;
        }

    .grid {
      display: grid;
      /* Dynamically set grid-template-columns based on longest animal name */
      grid-template-columns: repeat(12, 40px); /* Adjust if needed */
      grid-template-rows: repeat(11, 40px);
      gap: 2px;
      border: 3px solid #ff0;
      box-shadow: 0 0 10px 5px #ff0;
    }
    
    .cell {
      position: relative;
      width: 40px;
      height: 40px;
      border: 1px solid #8B4513;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #FFE4B5; /* Moccasin */
    }

    .cell input {
      width: 100%;
      height: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      border: none;
      outline: none;
      background-color: transparent;
      color: #2c3e50;
    }

    .subscript {
      font-size: 0.6em;
      color: #8B4513;
      position: absolute;
      top: 2px;
      left: 2px;
    }

    .black {
      background-color: #2c3e50;
    }

    .clues-container {
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    .clues {
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
      background: #F0E68C; /* Khaki */
      padding: 10px;
      border-radius: 10px;
    }

    .clues h2 {
      color: #8B4513;
      font-size: 1.5em;
      margin-top: 0;
    }

    .clues ul {
      list-style-type: none;
      padding-left: 0;
      color: #333;
      font-size: 1.1em;
    }

    .clues li {
      margin-bottom: 12px;
      line-height: 1.4;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #FF8C00; /* Dark orange */
      border: none;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 4px #E67E22; /* Carrot */
      transition: background 0.3s, transform 0.3s;
    }

    button:hover {
      background-color: #E67E22; /* Carrot */
      transform: translateY(-2px);
    }

    button:active {
      box-shadow: 0 2px #D35400; /* Pumpkin */
      transform: translateY(2px);
    }

    .status-message {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #2ecc71;
    }
    .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 15px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
  </style>
</head>
<body>

  <button class="back-button" onclick="goBack()">← Back</button>



<h1>Animals</h1>

<div class="crossword-container">
  <div class="grid"></div>
  <div class="clues">
    <h2>Across</h2>
    <ul id="across-clues"></ul>
    <h2>Down</h2>
    <ul id="down-clues"></ul>
  </div>
  
  </div>
</div>

<button onclick="checkCompletion()">Submit Puzzle</button>

<div class="status-message" id="status-message"></div>

<script>
    const crosswordData = {
      grid: [ 
      ['','','','S','H','E','E','P','','','',''],
      ['','','','','','','','A','','','',''],
      ['','','','','L','I','O','N','','','',''],
      ['H','O','R','S','E','','','D','O','G','',''],
      ['','','A','','O','','','A','','I','','G'],
      ['','','B','','P','I','G','','','R','','O'],
      ['','','B','','A','','','K','O','A','L','A'],
      ['','','I','','R','','','','','F','','T'],
      ['C','A','T','','D','','','','','F','',''],
      ['O','','','','','','T','I','G','E','R',''],
      ['W','O','L','F','','','','','','','',''],
    ],
    clues: {
        across: [
          { number: 1, clue: "I have wool that keeps you warm,And I bleat in the pasture, following the norm. What am I?", answer: "SHEEP", row: 0, col: 3 },
          { number: 3, clue: "The king of the jungle, I roar so loud,With a golden mane and standing proud. What am I?", answer: "LION", row: 2, col: 4},
          { number: 4, clue: "A large animal often used for riding,With hooves that go clip-clop, I'm often found in fields sliding. What am I?", answer: "HORSE", row: 3, col: 0 },
          { number: 6, clue: "A loyal companion, I bark and play,wag my tail and love to stay. What am I?", answer: "DOG", row: 3, col: 7 },
          { number: 9, clue: "I roll in mud and snort with glee,Known for being a little bit cheeky. What am I?", answer: "PIG", row: 5, col: 4 },
          { number: 10, clue: "I live in trees, a sleepy fellow,With ears so large and fur so mellow. What am I?", answer: "KOALA", row: 6, col: 7 },
          { number: 11, clue: "I purr and meow and love to nap,With whiskers on my face and a soft furry lap. What am I?", answer: "CAT", row: 8, col: 0 },
          { number: 12, clue: "I’m big and striped, a fierce predator,In the jungle, I’m a ruler, a creature to admire. What am I?", answer: "TIGER", row: 9, col: 6 },
          { number: 13, clue: "I howl at the moon and roam in packs,A cousin of the dog, but far from lax. What am I?", answer: "WOLF", row: 10, col: 0 }
        ],
        down: [
            { number: 2, clue: "Black and white, I’m a peaceful bear,Bamboo’s my favorite food, I eat it with care. What am I?", answer: "PANDA", row: 0, col: 7  },
            { number: 3, clue:  "With spots all over my sleek coat,I move fast and silently, like a boat. What am I?", answer: "LEOPARD", row: 2, col: 4 },
            { number: 5, clue: "With long ears and a twitching nose,I hop around where the carrots grow. What am I?", answer: "RABBIT", row: 3, col: 2 },
            { number: 7, clue: "I’m tall and have spots, with a neck so long,browse on the leaves where the branches belong. What am I?", answer: "GIRAFFE", row: 3, col: 9 },
            { number: 8, clue: "I like to climb and nibble on trees,I might eat your clothes if you let me please. What am I?", answer: "GOAT", row: 4, col: 11 },
            { number: 11, clue: "I give you milk and graze in the field,With horns on my head, I’m strong and sealed. What am I?", answer: "COW", row: 8, col: 0 }
        ], // Moved inside clues
    },
};

// DOM elements
const crosswordGrid = document.querySelector(".grid");
const acrossClues = document.querySelector("#across-clues");
const downClues = document.querySelector("#down-clues");
const statusMessage = document.querySelector("#status-message");

// Create the grid based on crosswordData
function createGrid() {
  crosswordData.grid.forEach((row, rowIndex) => {
    row.forEach((cell, colIndex) => {
      const cellDiv = document.createElement("div");
      cellDiv.classList.add("cell");

      if (cell) {
        const input = document.createElement("input");
        input.maxLength = 1;
        input.dataset.row = rowIndex;
        input.dataset.col = colIndex;
        input.addEventListener("input", handleInput);
        cellDiv.appendChild(input);

        const clueNumber = getClueNumber(rowIndex, colIndex);
        if (clueNumber) {
          const subscript = document.createElement("span");
          subscript.classList.add("subscript");
          subscript.textContent = clueNumber;
          cellDiv.appendChild(subscript);
        }
      } else {
        cellDiv.classList.add("black");
      }

      crosswordGrid.appendChild(cellDiv);
    });
  });
}

// Get clue number for a cell
function getClueNumber(row, col) {
  const acrossClue = crosswordData.clues.across.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (acrossClue) return acrossClue.number;

  const downClue = crosswordData.clues.down.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (downClue) return downClue.number;

  return '';
}

// Create clues list
function createClues() {
  crosswordData.clues.across.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    acrossClues.appendChild(clueItem);
  });

  crosswordData.clues.down.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    downClues.appendChild(clueItem);
  });
}

// Handle input and move to next cell
function handleInput(event) {
  const input = event.target;
  input.value = input.value.toUpperCase();

  let nextInput;
  if (input.value.match(/[A-Z]/)) {
    nextInput = getNextInput(input);
    if (nextInput) {
      nextInput.focus();
    }
  }
}

// Determine next input field
function getNextInput(input) {
  const row = parseInt(input.dataset.row);
  const col = parseInt(input.dataset.col);

  // Determine if the cell is part of an across or down word
  const isAcross = crosswordData.clues.across.some(
    (clue) => clue.row === row && clue.col <= col && clue.col + clue.answer.length > col
  );

  if (isAcross) {
    return document.querySelector(`input[data-row="${row}"][data-col="${col + 1}"]`);
  } else {
    return document.querySelector(`input[data-row="${row + 1}"][data-col="${col}"]`);
  }
}

// Check if the puzzle is completed correctly
function checkCompletion() {
  let allCorrect = true;

  // Check across words
  crosswordData.clues.across.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row}"][data-col="${clue.col + i}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Check down words
  crosswordData.clues.down.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row + i}"][data-col="${clue.col}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Display result
  if (allCorrect) {
    statusMessage.textContent = "Fantastic! You've completed the crossword!";
    statusMessage.style.color = "#00ff00"; // Green
  } else {
    statusMessage.textContent = "Some answers are incorrect. Keep trying!";
    statusMessage.style.color = "#ff0000"; // Red
  }
}

// Initialize the crossword
createGrid();
createClues();

function goBack() {
      window.location.href ="{{ url_for('crossword2ndpage') }}"; // Change "index.html" to your desired page
    }

</script>

</body>
</html>
