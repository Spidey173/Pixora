<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Crossword Puzzle Game</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #ff5f6d, #ffc371, #f7b733, #4ac29a, #485563, #2b5876);
            color: #fff;
        }

        h1 {
            margin-top: 20px;
            font-size: 2em;
            color: red;
        }
        .crossword-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(18, 40px); /* 14 columns */
            grid-template-rows: repeat(18, 40px);    /* 13 rows */
            gap: 2px;
            border: 3px solid #ff0;
            box-shadow: 0 0 10px 5px #ff0;
        }

        .cell {
      position: relative;
      width: 40px;
      height: 40px;
      border: 1px solid #8B4513;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #FFE4B5; /* Moccasin */
    }

    .cell input {
      width: 100%;
      height: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      border: none;
      outline: none;
      background-color: transparent;
      color: #2c3e50;
    }

    .subscript {
      font-size: 0.6em;
      color: #8B4513;
      position: absolute;
      top: 2px;
      left: 2px;
    }

    .black {
      background-color: #2c3e50;
    }

    .clues-container {
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    .clues {
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
      background: #F0E68C; /* Khaki */
      padding: 10px;
      border-radius: 10px;
    }

    .clues h2 {
      color: #8B4513;
      font-size: 1.5em;
      margin-top: 0;
    }

    .clues ul {
      list-style-type: none;
      padding-left: 0;
      color: #333;
      font-size: 1.1em;
    }

    .clues li {
      margin-bottom: 12px;
      line-height: 1.4;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #FF8C00; /* Dark orange */
      border: none;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 4px #E67E22; /* Carrot */
      transition: background 0.3s, transform 0.3s;
    }

    button:hover {
      background-color: #E67E22; /* Carrot */
      transform: translateY(-2px);
    }

    button:active {
      box-shadow: 0 2px #D35400; /* Pumpkin */
      transform: translateY(2px);
    }

    .status-message {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #2ecc71;
    }
    .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 15px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="goBack()">← Back</button>


    <h1>Famous Anime Shows</h1>

    <div class="crossword-container">
        <div class="grid"></div>
        <div class="clues">
          <h2>Across</h2>
          <ul id="across-clues"></ul>
          <h2>Down</h2>
          <ul id="down-clues"></ul>
    </div>

    <button onclick="checkCompletion()">Submit Puzzle</button>

    <div class="status-message" id="status-message"></div>

    <script>
        const crosswordData = {
            grid:[
                ['','','','','','B','','','','','','','','','','','',''],
                ['','','','S','O','L','O','L','E','V','E','L','I','N','G','','',''],
                ['','','','','','U','','','','','','','','','','','',''],
                ['','','','','D','E','A','T','H','N','O','T','E','','','','',''],
                ['','','','','','L','','','','','N','','','','','','',''],
                ['','','','J','','O','N','E','P','I','E','C','E','','','','',''],
                ['D','','','U','','C','','','O','','P','','','','D','','',''],
                ['R','','','J','','K','','','K','','U','','B','L','E','A','C','H'],
                ['A','','','U','','','','','E','','N','','','','M','','','A'],
                ['G','','','T','','','','','M','','C','','','','O','','','I'],
                ['O','','','S','','','','','O','','H','','','','N','','','K'],
                ['N','A','R','U','T','O','','','N','','M','','','','S','','','Y'],
                ['B','','','K','','','','','','','A','','','','L','','','U'],
                ['A','','','A','T','T','A','C','K','O','N','T','I','T','A','N','','U'],
                ['L','','','I','','','','','','','','','','','Y','','',''],
                ['L','','','S','P','Y','X','F','A','M','I','L','Y','','E','','',''],
                ['','','','E','','','','','','','','','','','R','','',''],
                ['','H','U','N','T','E','R','X','H','U','N','T','E','R','','','','']
            ],
            clues: {
        across: [
            { number: 2, clue: "A weak individual gains immense power and fights to survive in a world filled with dangerous monsters.", answer: "SOLOLEVELING", row: 1, col: 3 },
            { number: 3, clue: "A person gains a notebook that allows them to kill anyone by writing their name in it.", answer: "DEATHNOTE", row: 3, col: 4 },
            { number: 6, clue: "A pirate searches for the greatest treasure, the One Piece, to become the Pirate King.", answer: "ONEPIECE", row: 5, col: 5 },
            { number: 10, clue: "A teenager gains the powers of a Soul Reaper to protect the living world from evil spirits.", answer: "BLEACH", row: 7, col: 12 },
            { number: 12, clue: "A young ninja dreams of becoming the strongest in the village while overcoming challenges.", answer: "NARUTO", row: 11, col: 0 },
            { number: 13, clue: "Humanity battles giant creatures called Titans to survive in a destroyed world.", answer: "ATTACKONTITAN", row: 13, col: 3 },
            { number: 14, clue: "A spy creates a fake family for a mission, but the family members have their own secrets.", answer: "SPYXFAMILY", row: 15, col: 3 },
            { number: 15, clue: "An individual becomes a Hunter to uncover mysteries and search for a loved one.", answer: "HUNTERXHUNTER", row: 17, col: 1 }
        ],
        down: [
            { number: 1, clue: "A soccer program creates the world’s best striker by turning rivals into the strongest player.", answer: "BLUELOCK", row: 0, col: 5 },
            { number: 4, clue: "A superhero who can defeat any opponent with one punch struggles to find a worthy challenge.", answer: "ONEPUNCHMAN", row: 3, col: 10 },
            { number: 5, clue: "A teenager fights against dark supernatural forces called curses to protect others.", answer: "JUJUTSUKAISEN", row: 5, col: 3 },
            { number: 7, clue: "A trainer aims to become a Pokemon Master while capturing and training various creatures.", answer: "POKEMON", row: 5, col: 8 },
            { number: 8, clue: "A martial artist seeks powerful dragon balls and faces strong opponents on his adventure.", answer: "DRAGONBALL", row: 6, col: 0 },
            { number: 9, clue: "A person becomes a demon slayer to avenge family members and save a loved one turned into a demon.", answer: "DEMONSLAYER", row: 6, col: 14 },
            { number: 11, clue: "A volleyball player strives to become the best and lead their team to victory.", answer: "HAIKYUU", row: 7, col: 17 }
        ], // Moved inside clues
    },
};



// DOM elements
const crosswordGrid = document.querySelector(".grid");
const acrossClues = document.querySelector("#across-clues");
const downClues = document.querySelector("#down-clues");
const statusMessage = document.querySelector("#status-message");

// Create the grid based on crosswordData
function createGrid() {
  crosswordData.grid.forEach((row, rowIndex) => {
    row.forEach((cell, colIndex) => {
      const cellDiv = document.createElement("div");
      cellDiv.classList.add("cell");

      if (cell) {
        const input = document.createElement("input");
        input.maxLength = 1;
        input.dataset.row = rowIndex;
        input.dataset.col = colIndex;
        input.addEventListener("input", handleInput);
        cellDiv.appendChild(input);

        const clueNumber = getClueNumber(rowIndex, colIndex);
        if (clueNumber) {
          const subscript = document.createElement("span");
          subscript.classList.add("subscript");
          subscript.textContent = clueNumber;
          cellDiv.appendChild(subscript);
        }
      } else {
        cellDiv.classList.add("black");
      }

      crosswordGrid.appendChild(cellDiv);
    });
  });
}

// Get clue number for a cell
function getClueNumber(row, col) {
  const acrossClue = crosswordData.clues.across.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (acrossClue) return acrossClue.number;

  const downClue = crosswordData.clues.down.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (downClue) return downClue.number;

  return '';
}

// Create clues list
function createClues() {
  crosswordData.clues.across.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    acrossClues.appendChild(clueItem);
  });

  crosswordData.clues.down.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    downClues.appendChild(clueItem);
  });
}

// Handle input and move to next cell
function handleInput(event) {
  const input = event.target;
  input.value = input.value.toUpperCase();

  let nextInput;
  if (input.value.match(/[A-Z]/)) {
    nextInput = getNextInput(input);
    if (nextInput) {
      nextInput.focus();
    }
  }
}

// Determine next input field
function getNextInput(input) {
  const row = parseInt(input.dataset.row);
  const col = parseInt(input.dataset.col);

  // Determine if the cell is part of an across or down word
  const isAcross = crosswordData.clues.across.some(
    (clue) => clue.row === row && clue.col <= col && clue.col + clue.answer.length > col
  );

  if (isAcross) {
    return document.querySelector(`input[data-row="${row}"][data-col="${col + 1}"]`);
  } else {
    return document.querySelector(`input[data-row="${row + 1}"][data-col="${col}"]`);
  }
}

// Check if the puzzle is completed correctly
function checkCompletion() {
  let allCorrect = true;

  // Check across words
  crosswordData.clues.across.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row}"][data-col="${clue.col + i}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Check down words
  crosswordData.clues.down.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row + i}"][data-col="${clue.col}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Display result
  if (allCorrect) {
    statusMessage.textContent = "Fantastic! You've completed the crossword!";
    statusMessage.style.color = "#00ff00"; // Green
  } else {
    statusMessage.textContent = "Some answers are incorrect. Keep trying!";
    statusMessage.style.color = "#ff0000"; // Red
  }
}

// Initialize the crossword
createGrid();
createClues();

function goBack() {
      window.location.href = "{{ url_for('crossword2ndpage') }}"; // Change "index.html" to your desired page
    }

</script>

</body>
</html>
