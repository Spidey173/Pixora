<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cities Crossword Puzzle Game</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: linear-gradient(135deg, #FF4500, #2E8B57);
        color: #fff;
    }

    h1 {
        margin-top: 20px;
        font-size: 2em;
        color: yellow;
    }
    .crossword-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 20px;
        align-items: center;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(15, 40px); /* 16 columns */
        grid-template-rows: repeat(15, 40px); /* 15 rows */
        gap: 2px;
        border: 3px solid #ff0;
        box-shadow: 0 0 10px 5px #ff0;
    }

    .cell {
  position: relative;
  width: 40px;
  height: 40px;
  border: 1px solid #8B4513;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #FFE4B5; /* Moccasin */
}

.cell input {
  width: 100%;
  height: 100%;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  text-transform: uppercase;
  border: none;
  outline: none;
  background-color: transparent;
  color: #2c3e50;
}

.subscript {
  font-size: 0.6em;
  color: #8B4513;
  position: absolute;
  top: 2px;
  left: 2px;
}

.black {
  background-color: #2c3e50;
}

.clues-container {
  width: 300px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 20px;
}

.clues {
  width: 100%;
  max-height: 300px;
  overflow-y: auto;
  background: #F0E68C; /* Khaki */
  padding: 10px;
  border-radius: 10px;
}

.clues h2 {
  color: #8B4513;
  font-size: 1.5em;
  margin-top: 0;
}

.clues ul {
  list-style-type: none;
  padding-left: 0;
  color: #333;
  font-size: 1.1em;
}

.clues li {
  margin-bottom: 12px;
  line-height: 1.4;
}

button {
  padding: 10px 20px;
  font-size: 18px;
  font-weight: bold;
  color: #fff;
  background-color: #FF8C00; /* Dark orange */
  border: none;
  cursor: pointer;
  border-radius: 5px;
  box-shadow: 0 4px #E67E22; /* Carrot */
  transition: background 0.3s, transform 0.3s;
}

button:hover {
  background-color: #E67E22; /* Carrot */
  transform: translateY(-2px);
}

button:active {
  box-shadow: 0 2px #D35400; /* Pumpkin */
  transform: translateY(2px);
}

.status-message {
  margin-top: 20px;
  font-size: 24px;
  font-weight: bold;
  color: #2ecc71;
}
.back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 15px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
</style>
</head>
<body>
  <button class="back-button" onclick="goBack()">← Back</button>


<h1>Indian Cities</h1>


<div class="crossword-container">
    <div class="grid"></div>
    <div class="clues">
      <h2>Across</h2>
      <ul id="across-clues"></ul>
      <h2>Down</h2>
      <ul id="down-clues"></ul>
    </div>

<button onclick="checkCompletion()">Submit Puzzle</button>

<div class="status-message" id="status-message"></div>

<script>
  const crosswordData = {
    grid: [
    ['','','','A','G','R','A','','','','K','','','',''],
['','','','','','','M','','G','','O','','','',''],
['','','','','','','R','','O','','C','','','K',''],
['','C','H','A','N','D','I','G','A','R','H','','','O',''],
['','','','','','','T','','','','I','','','L',''],
['V','A','R','A','N','A','S','I','','','','','','K',''],
['','','','','','','A','','C','H','E','N','N','A','I'],
['','','M','Y','S','U','R','U','','Y','','','','T',''],
['','','U','','','','','','','D','','','','A',''],
['','','M','','','','L','','','E','','','','',''],
['','','B','E','N','G','A','L','U','R','U','','','',''],
['','','A','','','','D','','','A','','','','',''],
['','','I','','','','A','','','B','','','','',''],
['','','','','','','K','','J','A','I','P','U','R',''],
['N','E','W','D','E','L','H','I','','D','','','','','']


    ],
    clues: {
        across: [
           { number: 1, clue: "Known for the Taj Mahal, a wonder of love,I’m a city you’ll never get enough of.What city am I?", answer: "AGRA", row: 0, col: 3 },
           { number: 6, clue: "I’m a planned city, designed with care,Capitol of two states, a rare affair.What city am I?", answer: "CHANDIGARH", row: 3, col: 1 },
           { number: 7, clue: "The Ganges flows through me, holy and pure,Pilgrims come for salvation, they’re sure.What city am I?",answer: "VARANASI", row: 5, col: 0 },
           { number: 8, clue: "I host a festival of music, tradition, and cheer,My spicy sambhar and dosa bring foodies near.Home to Kollywood and a rich cultural glow,What city am I?", answer: "CHENNAI", row: 6, col: 8 },
           { number: 10, clue: "I’m a city of palaces, a royal delight,Known for Dasara and lights so bright.With sandalwood and silk, I’m a treasure to see,What city am I?", answer: "MYSURU", row: 7, col: 2 },
           { number: 12, clue: "I’m the Silicon Valley of India, they say,Where technology rules the day.What city am I?", answer: "BENGALURU", row: 10, col: 2 },
           { number: 13, clue: "I’m known as the “Pink City,” vibrant and grand,My palaces and forts are truly in demand.What city am I?", answer: "JAIPUR", row: 13, col: 8 },
           { number: 14, clue: "The capital city, bustling and bold,With monuments that are centuries old.What city am I?", answer: "NEWDELHI", row: 14, col: 0 }
        ],
        down: [
           { number: 2, clue: "A city with a golden temple so divine,People visit to pray and dine.What city am I?", answer: "AMRITSAR", row: 0, col: 6 },
           { number: 3, clue: "Spices and backwaters define me well,A paradise in Kerala, where I dwell.What city am I?", answer: "KOCHI", row: 0, col: 10 },
           { number: 4, clue: "My beaches are golden, my nightlife is grand,I’m a party destination, the best in the land.What city am I?", answer: "GOA", row: 1, col: 8 },
           { number: 5, clue: "I’m a city that dances to its own beat,known for rasgullas, art, and treats so sweet.Durga Puja here is a sight to see,What city am I?", answer: "KOLKATA", row: 2, col: 13 },
           { number: 9, clue: "A city of pearls and spicy biryani delight,With Charminar and bazaars, I shine so bright.What city am I?", answer: "HYDERABAD", row: 6, col: 9 },
           { number: 10, clue: "I’m the financial capital, always awake,Bollywood dreams and the Arabian Sea in my wake.What city am I?", answer: "MUMBAI", row: 7, col: 2 },
           { number: 11, clue: "I’m a cold desert with monasteries so grand,Breathtaking landscapes and mountains I command.Known for Pangong Lake and peace in the air,What place am I?", answer: "LADAKH", row: 9, col: 6 },
        ], // Moved inside clues
    },
};

// DOM elements
const crosswordGrid = document.querySelector(".grid");
const acrossClues = document.querySelector("#across-clues");
const downClues = document.querySelector("#down-clues");
const statusMessage = document.querySelector("#status-message");

// Create the grid based on crosswordData
function createGrid() {
  crosswordData.grid.forEach((row, rowIndex) => {
    row.forEach((cell, colIndex) => {
      const cellDiv = document.createElement("div");
      cellDiv.classList.add("cell");

      if (cell) {
        const input = document.createElement("input");
        input.maxLength = 1;
        input.dataset.row = rowIndex;
        input.dataset.col = colIndex;
        input.addEventListener("input", handleInput);
        cellDiv.appendChild(input);

        const clueNumber = getClueNumber(rowIndex, colIndex);
        if (clueNumber) {
          const subscript = document.createElement("span");
          subscript.classList.add("subscript");
          subscript.textContent = clueNumber;
          cellDiv.appendChild(subscript);
        }
      } else {
        cellDiv.classList.add("black");
      }

      crosswordGrid.appendChild(cellDiv);
    });
  });
}

// Get clue number for a cell
function getClueNumber(row, col) {
  const acrossClue = crosswordData.clues.across.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (acrossClue) return acrossClue.number;

  const downClue = crosswordData.clues.down.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (downClue) return downClue.number;

  return '';
}

// Create clues list
function createClues() {
  crosswordData.clues.across.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    acrossClues.appendChild(clueItem);
  });

  crosswordData.clues.down.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    downClues.appendChild(clueItem);
  });
}

// Handle input and move to next cell
function handleInput(event) {
  const input = event.target;
  input.value = input.value.toUpperCase();

  let nextInput;
  if (input.value.match(/[A-Z]/)) {
    nextInput = getNextInput(input);
    if (nextInput) {
      nextInput.focus();
    }
  }
}

// Determine next input field
function getNextInput(input) {
  const row = parseInt(input.dataset.row);
  const col = parseInt(input.dataset.col);

  // Determine if the cell is part of an across or down word
  const isAcross = crosswordData.clues.across.some(
    (clue) => clue.row === row && clue.col <= col && clue.col + clue.answer.length > col
  );

  if (isAcross) {
    return document.querySelector(`input[data-row="${row}"][data-col="${col + 1}"]`);
  } else {
    return document.querySelector(`input[data-row="${row + 1}"][data-col="${col}"]`);
  }
}

// Check if the puzzle is completed correctly
function checkCompletion() {
  let allCorrect = true;

  // Check across words
  crosswordData.clues.across.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row}"][data-col="${clue.col + i}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Check down words
  crosswordData.clues.down.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row + i}"][data-col="${clue.col}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Display result
  if (allCorrect) {
    statusMessage.textContent = "Fantastic! You've completed the crossword!";
    statusMessage.style.color = "#00ff00"; // Green
  } else {
    statusMessage.textContent = "Some answers are incorrect. Keep trying!";
    statusMessage.style.color = "#ff0000"; // Red
  }
}

// Initialize the crossword
createGrid();
createClues();

function goBack() {
      window.location.href = "{{ url_for('crossword2ndpage') }}"; // Change "index.html" to your desired page
    }

</script>

</body>
</html>
