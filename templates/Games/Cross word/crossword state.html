<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian States Crossword</title>
    <style>
        body {
            font-family: 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #FF69B4, #FFD700);
            color: #333;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 20px;
            font-size: 2.5em;
            color: #2c3e50;
            text-shadow: 2px 2px 5px #ecf0f1;
        }

        .crossword-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(20, 30px);
            grid-template-rows: repeat(17, 30px);
            gap: 2px;
            border: 2px solid #3498db;
            box-shadow: 0 0 10px 5px #3498db;
        }
        
        .cell {
      position: relative;
      width: 40px;
      height: 40px;
      border: 1px solid #8B4513;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #FFE4B5; /* Moccasin */
    }

    .cell input {
      width: 100%;
      height: 100%;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
      text-transform: uppercase;
      border: none;
      outline: none;
      background-color: transparent;
      color: #2c3e50;
    }

    .subscript {
      font-size: 0.6em;
      color: #8B4513;
      position: absolute;
      top: 2px;
      left: 2px;
    }

    .black {
      background-color: #2c3e50;
    }

    .clues-container {
      width: 300px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 20px;
    }

    .clues {
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
      background: #F0E68C; /* Khaki */
      padding: 10px;
      border-radius: 10px;
    }

    .clues h2 {
      color: #8B4513;
      font-size: 1.5em;
      margin-top: 0;
    }

    .clues ul {
      list-style-type: none;
      padding-left: 0;
      color: #333;
      font-size: 1.1em;
    }

    .clues li {
      margin-bottom: 12px;
      line-height: 1.4;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background-color: #FF8C00; /* Dark orange */
      border: none;
      cursor: pointer;
      border-radius: 5px;
      box-shadow: 0 4px #E67E22; /* Carrot */
      transition: background 0.3s, transform 0.3s;
    }

    button:hover {
      background-color: #E67E22; /* Carrot */
      transform: translateY(-2px);
    }

    button:active {
      box-shadow: 0 2px #D35400; /* Pumpkin */
      transform: translateY(2px);
    }

    .status-message {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #2ecc71;
    }
    .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 15px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="goBack()">← Back</button>

    <h1>Indian States and Union Territories</h1>

    <div class="crossword-container">
        <div class="grid"></div>
        <div class="clues">
          <h2>Across</h2>
          <ul id="across-clues"></ul>
          <h2>Down</h2>
          <ul id="down-clues"></ul>
        </div>

    <button onclick="checkCompletion()">Submit Puzzle</button>

    <div class="status-message" id="status-message"></div>

    <script>
        const crosswordData = {
            grid:[
            ['','','','U','T','T','A','R','P','R','A','D','E','S','H','','','','',''],
            ['','','','','','','N','','','','','','','','','A','','','',''],
            ['','','','','C','','D','','','','W','','','','','R','','','',''],
            ['','','','','H','','R','','','','E','','','','','U','','','',''],
            ['','','G','O','A','','A','','','','S','','','','','N','','M','',''],
            ['','','','','N','','P','','','','T','','','','','A','','A','',''],
            ['A','','L','','D','','R','','','','B','','','','','C','','D','',''],
            ['S','','A','','I','','A','','','','E','','K','','','H','','Y','',''],
            ['S','','K','','G','','D','','P','U','N','J','A','B','','A','','A','',''],
            ['A','','S','','A','','E','','','','G','','R','','','L','','P','',''],
            ['M','A','H','A','R','A','S','H','T','R','A','','N','','','P','','R','',''],
            ['','','A','','H','','H','','','','L','','A','','','R','','A','',''],
            ['','','D','','','','','','','','','','T','','','A','','D','',''],
            ['','','W','','','D','','','','','','','A','','','D','','E','',''],
            ['','','E','','','E','','','','','','','K','','','E','','S','',''],
            ['','K','E','R','A','L','A','','','','','R','A','J','A','S','T','H','A','N'],
            ['','','P','','','H','','','','','','','','','','H','','','',''],
            ['','','','','','I','','','','','','','','','','','','','','']
        ],
   clues: {
        across: [
        { number: 1, clue: "I am the land of the Taj Mahal, home to a thriving handloom and pottery industry. Who am I?", answer: "UTTARPRADESH", row: 0, col: 3 },
        { number: 6, clue: "I am a small state, known for my pristine beaches, Portuguese heritage, and vibrant tourism. What am I?", answer: "GOA", row: 4, col: 2 },
        { number: 11, clue: "I am the land of five rivers, known for my agriculture, textiles, and vibrant culture. Who am I?", answer: "PUNJAB", row: 8, col: 8 },
        { number: 12, clue: "I am home to Bollywood, the industrial hub of India, and have a long coastline. Who am I?", answer: "MAHARASHTRA", row: 10, col: 0 },
        { number: 13, clue: "I am known for my backwaters, coconut plantations, and the spice trade. Who am I?", answer: "KERALA", row: 15, col: 1 },
        { number: 15, clue: "I am home to the desert, majestic forts, and rich in textiles and handicrafts. What is my name?", answer: "RAJASTHAN", row: 15, col: 11 },
        ],
        down: [
        { number: 2, clue: "I am known for my beautiful temples, rich textiles, and thriving rice fields. My coast is home to the city of pearls, which is also a hub for film production. Who am I?", answer: "ANDRAPRADESH", row: 0, col: 6 },
        { number: 3, clue: "I am a land of festivals, snow-clad mountains, and vast forests, sharing borders with Bhutan, China, and Myanmar. What am I?", answer: "ARUNACHALPRADESH", row: 1, col: 15 },
        { number: 4, clue: "I am the capital of two states and known for my modern architecture and well-planned city. Who am I?", answer: "CHANDIGARH", row: 2, col: 4 },
        { number: 5, clue: "I am known for my culture, tea gardens, and an industrial hub of jute and textiles. Who am I?", answer: "WESTBENGAL", row: 2, col: 10 },
        { number: 7, clue: "I am the heart of India, known for my forests, temples, and the Kanha tiger reserve. What is my name?", answer: "MADYAPRADESH", row: 4, col: 17 },
        { number: 8, clue: "I am famous for my tea gardens, the mighty Brahmaputra River, and my silk weaving industry. What is my name?", answer: "ASSAM", row: 6, col: 0 },
        { number: 9, clue: "I am an island group in the Arabian Sea, famous for my coral reefs and marine life. Who am I?", answer: "LAKSHADWEEP", row: 6, col: 2 },
        { number: 10, clue: "I am the tech capital of India, famous for my silicon city, and my coffee plantations. What am I?", answer: "KARNATAKA", row: 7, col: 12 },
        { number: 14, clue: "I am the capital city of India, home to historic monuments and a hub of politics. What is my name?", answer: "DELHI", row: 13, col: 5 },
        ], // Moved inside clues
    },
};

// DOM elements
const crosswordGrid = document.querySelector(".grid");
const acrossClues = document.querySelector("#across-clues");
const downClues = document.querySelector("#down-clues");
const statusMessage = document.querySelector("#status-message");

// Create the grid based on crosswordData
function createGrid() {
  crosswordData.grid.forEach((row, rowIndex) => {
    row.forEach((cell, colIndex) => {
      const cellDiv = document.createElement("div");
      cellDiv.classList.add("cell");

      if (cell) {
        const input = document.createElement("input");
        input.maxLength = 1;
        input.dataset.row = rowIndex;
        input.dataset.col = colIndex;
        input.addEventListener("input", handleInput);
        cellDiv.appendChild(input);

        const clueNumber = getClueNumber(rowIndex, colIndex);
        if (clueNumber) {
          const subscript = document.createElement("span");
          subscript.classList.add("subscript");
          subscript.textContent = clueNumber;
          cellDiv.appendChild(subscript);
        }
      } else {
        cellDiv.classList.add("black");
      }

      crosswordGrid.appendChild(cellDiv);
    });
  });
}

// Get clue number for a cell
function getClueNumber(row, col) {
  const acrossClue = crosswordData.clues.across.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (acrossClue) return acrossClue.number;

  const downClue = crosswordData.clues.down.find(
    (clue) => clue.row === row && clue.col === col
  );
  if (downClue) return downClue.number;

  return '';
}

// Create clues list
function createClues() {
  crosswordData.clues.across.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    acrossClues.appendChild(clueItem);
  });

  crosswordData.clues.down.forEach((clue) => {
    const clueItem = document.createElement("li");
    clueItem.textContent = `${clue.number}. ${clue.clue}`;
    downClues.appendChild(clueItem);
  });
}

// Handle input and move to next cell
function handleInput(event) {
  const input = event.target;
  input.value = input.value.toUpperCase();

  let nextInput;
  if (input.value.match(/[A-Z]/)) {
    nextInput = getNextInput(input);
    if (nextInput) {
      nextInput.focus();
    }
  }
}

// Determine next input field
function getNextInput(input) {
  const row = parseInt(input.dataset.row);
  const col = parseInt(input.dataset.col);

  // Determine if the cell is part of an across or down word
  const isAcross = crosswordData.clues.across.some(
    (clue) => clue.row === row && clue.col <= col && clue.col + clue.answer.length > col
  );

  if (isAcross) {
    return document.querySelector(`input[data-row="${row}"][data-col="${col + 1}"]`);
  } else {
    return document.querySelector(`input[data-row="${row + 1}"][data-col="${col}"]`);
  }
}

// Check if the puzzle is completed correctly
function checkCompletion() {
  let allCorrect = true;

  // Check across words
  crosswordData.clues.across.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row}"][data-col="${clue.col + i}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Check down words
  crosswordData.clues.down.forEach((clue) => {
    const answer = clue.answer.toUpperCase();
    let userAnswer = '';

    for (let i = 0; i < answer.length; i++) {
      const cell = document.querySelector(
        `input[data-row="${clue.row + i}"][data-col="${clue.col}"]`
      );
      userAnswer += cell ? cell.value.toUpperCase() : '';
    }

    if (userAnswer !== answer) {
      allCorrect = false;
    }
  });

  // Display result
  if (allCorrect) {
    statusMessage.textContent = "Fantastic! You've completed the crossword!";
    statusMessage.style.color = "#00ff00"; // Green
  } else {
    statusMessage.textContent = "Some answers are incorrect. Keep trying!";
    statusMessage.style.color = "#ff0000"; // Red
  }
}

// Initialize the crossword
createGrid();
createClues();

function goBack() {
      window.location.href = "{{ url_for('crossword2ndpage') }}"; // Change "index.html" to your desired page
    }

</script>

</body>
</html>
