<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Mode - Pong Wars</title>
    <style>
        /* Animated Background */
        @keyframes bgAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* General Body Styling */
        body {
            background: linear-gradient(135deg, #ff6a00, #ff8c00, #ffeb3b, #c2185b);
            background-size: 400% 400%;
            animation: bgAnimation 10s infinite alternate;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        /* Title Styling */
        h1 {
            font-size: 55px;
            color: black;
            letter-spacing: 3px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        /* Mode Container */
        .modes-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            max-width: 900px;
        }

        /* Mode Frame (Glassmorphism & Neon Glow) */
        .mode-frame {
            width: 380px;
            height: 220px;
            background-size: cover;
            background-position: center;
            border-radius: 20px;
            cursor: pointer;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            position: relative;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.4);
            border: 3px solid transparent;
        }

        /* Hover Effects - Neon Pulse */
        .mode-frame:hover {
            transform: scale(1.15) rotate(3deg);
            box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.8),
                        0px 0px 40px rgba(255, 165, 0, 0.9);
            border: 3px solid rgba(255, 255, 255, 0.6);
        }

        /* Mode Title with Neon Glow */
        .mode-title {
            color: black;
            font-size: 40px;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Select Mode</h1>
    <div class="modes-container">
        <div>
            <div class="mode-frame" style="background-image: url('/static/Games/pong/field.png');" onclick="window.location.href='{{ url_for('pongeasy') }}'"></div>
            <div class="mode-title">Easy</div>
        </div>
        <div>
            <div class="mode-frame" style="background-image: url('/static/Games/pong/field.png');" onclick="window.location.href='{{ url_for('pongmedium') }}'"></div>
            <div class="mode-title">Medium</div>
        </div>
        <div>
            <div class="mode-frame" style="background-image: url('/static/Games/pong/field.png');" onclick="window.location.href='{{ url_for('ponghard') }}'"></div>
            <div class="mode-title">Hard</div>
        </div>
        <div>
            <div class="mode-frame" style="background-image: url('/static/Games/pong/football.png');" onclick="window.location.href='{{ url_for('football') }}'"></div>
            <div class="mode-title">Football</div>
        </div>
    </div>
</body>
</html>
