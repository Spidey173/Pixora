    <style>
        /* General Styles */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(to right, #6a11cb, #2575fc); /* New vibrant gradient */
    background-size: cover;
}

#game-container {
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
}

#game-box {
    background-color: rgba(255, 255, 255, 0.9);
    padding: 30px;
    width: 450px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    position: relative;
    animation: slideIn 0.5s ease;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.timer {
    font-size: 2rem;
    position: absolute;
    top: 10px;
    right: 10px;
}

h2 {
    font-size: 1.8rem;
    margin-bottom: 20px;
}

input[type="text"] {
    padding: 10px;
    width: 80%;
    font-size: 1rem;
    margin-bottom: 20px;
    border: 2px solid #ccc;
    border-radius: 8px;
    outline: none;
}

button {
    padding: 10px 20px;
    background-color: #ff4b2b;
    color: white;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    font-size: 1.2rem;
    transition: 0.3s;
}

button:hover {
    background-color: #ff416c;
}

#feedback {
    margin-top: 20px;
    font-size: 1.2rem;
    color: #333;
}

img {
    margin-top: 20px;
    width: 200px;
    height: auto;
    display: block;
    margin-left: auto;
    margin-right: auto;
}

/* Final result screen styles */
#result-screen {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    background-color: #222;
    padding: 50px;
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    color: white;
    font-family: 'Roboto', sans-serif;
    transition: all 0.3s ease-in-out;
}

#result-screen h1 {
    font-size: 2.5em;
    font-weight: bold;
    margin-bottom: 20px;
}

#result-screen button {
    background-color: #f44336;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 1.2em;
    cursor: pointer;
    border-radius: 5px;
    transition: background-color 0.3s ease;
}

#result-screen button:hover {
    background-color: #d32f2f;
}

/* Styling based on the score */
.extraordinary {
    background-color: #4caf50;
    color: #fff;
}

.good {
    background-color: #2196f3;
    color: #fff;
}

.better-luck {
    background-color: #ff9800;
    color: #fff;
}

        .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 15px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }

let thinkingSound = document.getElementById('thinking-sound');
let congratsSound = document.getElementById('congrats-sound');
let wrongSound = document.getElementById('wrong-sound');
let lastResultSound = document.getElementById('last-result-sound'); // Sound for final result

let submitBtn = document.getElementById('submit-btn');
let timerElement = document.getElementById('timer');
let feedbackElement = document.getElementById('feedback');
let answerImage = document.getElementById('answer-image');
let questionElement = document.getElementById('question');
let answerInput = document.getElementById('answer');

// Add event listener to submit button and handle Enter key
submitBtn.addEventListener('click', () => checkAnswer(false));
answerInput.addEventListener('keypress', function (event) {
    if (event.key === 'Enter') {
        checkAnswer(false);
    }
});

// Start the game
function startGame() {
    correctAnswers = 0;
    wrongAnswers = 0;
    loadRiddle();
    thinkingSound.play();  // Play thinking sound as soon as the game starts
    startTimer();  // Start timer when game begins
}

// Start a new timer for each riddle
function startTimer() {
    timeLeft = 30;  // Reset timer to 30 seconds for the next riddle
    timerElement.textContent = timeLeft;
    if (timerInterval) {
        clearInterval(timerInterval);  // Clear any previous interval
    }
    timerInterval = setInterval(updateTimer, 1000);  // Start the timer
}

// Update the timer every second
function updateTimer() {
    if (timeLeft > 0) {
        timeLeft--;
        timerElement.textContent = timeLeft;
    } else {
        clearInterval(timerInterval);
        if (currentRiddleIndex < riddles.length) {
            checkAnswer(true);  // Check answer when time runs out and mark it as wrong
        }
    }
}

// Load the riddle and reset the input box
function loadRiddle() {
    if (currentRiddleIndex < riddles.length) {
        let riddle = riddles[currentRiddleIndex];
        questionElement.textContent = riddle.question;
        answerInput.value = '';
        feedbackElement.textContent = '';
        answerImage.style.display = 'none';
        thinkingSound.play();  // Ensure thinking sound plays for each riddle
        submitBtn.disabled = false; // Enable submit button for the current riddle
        startTimer();  // Start timer every time a new riddle is loaded
    } else {
        showFinalScore();  // Show final score when all riddles are answered
    }
}

// Check the answer and provide feedback
function checkAnswer(timeExpired = false) {
    // If the timer has expired and the submit button was clicked, ignore the click
    if (timeLeft === 0 && !timeExpired) {
        return; // Exit if time is already expired and user clicks submit
    }

    let riddle = riddles[currentRiddleIndex];
    let answer = answerInput.value.trim().toLowerCase();  // Convert answer to lowercase

    // Stop the thinking sound and timer immediately after submission
    thinkingSound.pause();
    clearInterval(timerInterval);  // Stop the timer
    
    let resultMessage = '';
    let imageSrc = '';

    if (timeExpired) {
        // If time expired, consider the answer wrong
        resultMessage = `Time's up! ${riddle.feedbackWrong}`;
        wrongSound.play();
        wrongAnswers++;
        imageSrc = riddle.wrongImage;
    } else if (riddle.answers.some(correctAnswer => correctAnswer.toLowerCase() === answer)) {  // Check if the answer matches any correct answers (case insensitive)
        resultMessage = riddle.feedbackCorrect;
        congratsSound.play();
        correctAnswers++;
        imageSrc = riddle.image;
    } else {
        resultMessage = `${riddle.feedbackWrong}`;
        wrongSound.play();
        wrongAnswers++;
        imageSrc = riddle.wrongImage;
    }

    feedbackElement.textContent = resultMessage;
    answerImage.src = imageSrc;
    answerImage.style.display = 'block';

    currentRiddleIndex++;
    submitBtn.disabled = true; // Disable submit after answer

    setTimeout(() => {
        if (currentRiddleIndex < riddles.length) {
            loadRiddle(); // Load next riddle after a short delay (5 seconds)
        } else {
            showFinalScore(); // Show final score when all riddles are done
        }
    }, 5000);  // 5 seconds delay before the next riddle
}

// Show final score
function showFinalScore() {
    let resultText = '';
    let resultClass = '';

    if (correctAnswers > wrongAnswers) {
        resultText = `You got ${correctAnswers} out of ${riddles.length} correct. Amazing!`;
        resultClass = 'extraordinary';
    } else if (correctAnswers === wrongAnswers) {
        resultText = `You got ${correctAnswers} out of ${riddles.length}. Good job!`;
        resultClass = 'good';
    } else {
        resultText = `You got ${correctAnswers} out of ${riddles.length}. Better luck next time!`;
        resultClass = 'better-luck';
    }

    let resultScreen = document.getElementById('result-screen');
    resultScreen.querySelector('h1').textContent = resultText;
    resultScreen.classList.add(resultClass);
    resultScreen.style.display = 'block';  // Show the result screen
    document.getElementById('game-container').style.display = 'none';  // Hide the game screen

    lastResultSound.play();  // Play the final result sound
}

// Start the game when the page is loaded
