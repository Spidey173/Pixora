<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conquer the Maze</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      background: #0a0a0a;
      overflow: hidden;
      position: relative;
    }

    /* Animated grid background */
    body::before {
      content: '';
      position: absolute;
      width: 200%;
      height: 200%;
      background: 
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(180deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      animation: moveGrid 40s linear infinite;
      z-index: -1;
    }

    @keyframes moveGrid {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-50%, -50%); }
    }


    h1 {
      font-size: 5em;
      font-weight: 900;
      text-transform: uppercase;
      margin: 0;
      position: relative;
      background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(78, 205, 196, 0.4);
      animation: titleGlitch 3s infinite;
    }

    @keyframes titleGlitch {
      0%, 100% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
    }



    .button-container {
      display: flex;
      justify-content: center;
      gap: 20px; /* Space between buttons */
      margin-top: 30px;
    }
    button {
      font-size: 2em;
      padding: 15px 40px;
      background: transparent;
      color: #fff;
      border: 3px solid #4ecdc4;
      border-radius: 15px;      
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(78, 205, 196, 0.4),
        transparent
      );
      transition: 0.5s;
    }

    button:hover::before {
      left: 100%;
    }

    button:hover {
      background: rgba(78, 205, 196, 0.1);
      box-shadow: 0 0 30px rgba(78, 205, 196, 0.4);
      transform: scale(1.05);
    }

    .difficulty-button {
      border-radius: 40px; /* More rounded edges */
      font-size: 1.8em;
      padding: 20px 60px;
      width: 250px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.4);
    }

    .difficulty-button:hover {
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <h1>Select the level</h1>

  <!-- Container for the difficulty buttons -->
  <div class="button-container">
    <button class="difficulty-button" onclick="location.href='{{ url_for('mazeveasy') }}'">Very Easy</button>
    <button class="difficulty-button" onclick="location.href='{{ url_for('mazeeasy') }}'">Easy</button>
    <button class="difficulty-button" onclick="location.href='{{ url_for('mazemedium') }}'">Medium</button>
    <button class="difficulty-button" onclick="location.href='{{ url_for('mazehard') }}'">Hard</button>
  </div>

</body>
</html>
