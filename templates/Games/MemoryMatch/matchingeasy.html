<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match Game</title>
  <style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #a8e063, #56ab2f);
        color: #4e342e;
        display: flex;
        justify-content: center; /* Center horizontally */
        align-items: center; /* Center vertically */
        height: 100vh; /* Make sure it takes full viewport height */
        flex-direction: column; /* Keep the timer and moves on top */
      }
      
      .grid {
        display: grid;
        grid-template-columns: repeat(4, 120px); /* 4x4 Grid */
        gap: 10px;
        justify-content: center;
        margin-top: 20px;
      }
      
      .timer, .moves {
        font-size: 30px;
        margin-top: 10px;
      }
      
    .card {
      width: 120px;
      height: 120px;
      background-color: #333;
      color: white;
      font-size: 36px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 10px;
      cursor: pointer;
      transform: scale(1);
      transition: transform 0.2s;
    }
    .card:hover {
      transform: scale(1.1);
    }
    .card.flipped {
      background-color: rgba(225, 71, 71, 0.666);
      color: #333;
      pointer-events: none;
    }
    .result-box {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      display: none;
      width: 80%;
      max-width: 400px;
    }
    .result-box h2 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #f5ba13;
      animation: pop 0.5s ease-in-out;
    }
    .result-box p {
      font-size: 20px;
      margin: 10px 0;
    }
    .restart-btn {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      background-color: #f5ba13;
      color: #1e1e2f;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .restart-btn:hover {
      background-color: #d4a110;
    }
    @keyframes pop {
      0% {
        transform: scale(0.8);
      }
      50% {
        transform: scale(1.1);
      }
      100% {
        transform: scale(1);
      }
    }
    .back-button {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 8px 15px;
      font-size: 16px;
      background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }
  </style>
</head>
<body>
  <button class="back-button" onclick="goBack()">← Back</button>

  <div class="timer" id="time">Time: 0s</div>
  <div class="grid" id="grid"></div>
  <div class="moves" id="moves">Moves: 0</div>
  <div class="result-box" id="result-box">
    <h2 id="result-title"></h2>
    <p id="result-details"></p>
    <button class="restart-btn" onclick="restartGame()">Restart</button>
  </div>

  <script>
    const emojis = ['🍎', '🍎', '🐶', '🐶', '⚽', '⚽', '🚗', '🚗', '🌟', '🌟', 
                    '🎈', '🎈', '🎵', '🎵', '🍫', '🍫'];
    emojis.sort(() => 0.5 - Math.random());

    const grid = document.getElementById('grid');
    const movesCounter = document.getElementById('moves');
    const timeCounter = document.getElementById('time');
    const resultBox = document.getElementById('result-box');
    const resultTitle = document.getElementById('result-title');
    const resultDetails = document.getElementById('result-details');

    let firstCard, secondCard;
    let lockBoard = false;
    let moves = 0;
    let time = 0;
    let timerInterval;
    let matchedPairs = 0;

    function startTimer() {
      timerInterval = setInterval(() => {
        time++;
        timeCounter.textContent = `Time: ${time}s`;
      }, 1000);
    }

    emojis.forEach((emoji) => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.dataset.emoji = emoji;
      card.innerHTML = '?'; // Default face-down
      grid.appendChild(card);

      card.addEventListener('click', () => flipCard(card));
    });

    function flipCard(card) {
      if (lockBoard || card === firstCard) return;

      if (time === 0) startTimer(); // Start timer on first flip

      card.innerHTML = card.dataset.emoji;
      card.classList.add('flipped');

      if (!firstCard) {
        firstCard = card;
        return;
      }

      secondCard = card;
      lockBoard = true;
      moves++;
      movesCounter.textContent = `Moves: ${moves}`;

      checkForMatch();
    }

    function checkForMatch() {
      if (firstCard.dataset.emoji === secondCard.dataset.emoji) {
        keepCardsFlipped();
      } else {
        unflipCards();
      }
    }

    function keepCardsFlipped() {
      firstCard = null;
      secondCard = null;
      lockBoard = false;
      matchedPairs++;

      if (matchedPairs === emojis.length / 2) {
        gameOver();
      }
    }

    function unflipCards() {
      setTimeout(() => {
        firstCard.innerHTML = '?';
        secondCard.innerHTML = '?';
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        resetBoard();
      }, 1000);
    }

    function resetBoard() {
      [firstCard, secondCard] = [null, null];
      lockBoard = false;
    }

    function gameOver() {
      clearInterval(timerInterval); // Stop the timer immediately
      resultBox.style.display = 'block'; // Show result box
    
      // Hide the timer and moves counters
      timeCounter.style.display = 'none';
      movesCounter.style.display = 'none';
    
      let titleMessage;
      if (moves < 16) {
        titleMessage = 'Amazing!';
      } else if (moves <= 20) {
        titleMessage = 'Well Done!';
      } else {
        titleMessage = 'Good!';
      }
    
      resultTitle.textContent = titleMessage;
      resultDetails.textContent = `You used ${moves} moves and finished in ${time}s.`;

      // Submit score telemetry
      const finalScore = Math.max(10, 1000 - (moves * 15) - (time * 5));
      fetch('/api/score/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game_name: 'Memory Match Easy', score: finalScore })
      }).catch(err => console.log('Score submission error:', err));
    }

    

    function restartGame() {
      clearInterval(timerInterval); // Stop any running timer
      time = 0; // Reset time
      moves = 0; // Reset moves
      matchedPairs = 0; // Reset matched pairs
      lockBoard = false; // Unlock board
      firstCard = null; // Reset selected cards
      secondCard = null;
    
      // Reset UI elements
      timeCounter.style.display = 'block'; // Show timer
      movesCounter.style.display = 'block'; // Show moves
      timeCounter.textContent = 'Time: 0s';
      movesCounter.textContent = 'Moves: 0';
      resultBox.style.display = 'none'; // Hide result box
      grid.innerHTML = ''; // Clear the grid
    
      // Shuffle emojis and recreate the grid
      emojis.sort(() => 0.5 - Math.random());
      emojis.forEach((emoji) => {
        const card = document.createElement('div');
        card.classList.add('card');
        card.dataset.emoji = emoji;
        card.innerHTML = '?'; // Default face-down
        grid.appendChild(card);
    
        card.addEventListener('click', () => flipCard(card));
      });
    }

    function goBack() {
      window.location.href = "{{ url_for('memorymatch2nd') }}"; // Change "index.html" to your desired page
    }
    
</script>
</body>
</html>
