<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Sequence</title>
    <style>
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: radial-gradient(circle, #001f3f, #0074D9);
    color: #fff;
    overflow: hidden;
}

.game-container {
    text-align: center;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 15px;
    box-shadow: 0px 10px 25px rgba(0, 255, 255, 0.3);
    padding: 30px;
    width: 90%;
    max-width: 800px;
    position: relative;
}

.timer {
    font-size: 1.2rem;
    font-weight: bold;
    background: #00A8E8;
    padding: 10px 20px;
    border-radius: 8px;
    position: absolute;
    top: 10px;
    right: 10px;
    box-shadow: 0 0 10px rgba(0, 168, 232, 0.8);
}

.question {
    font-size: 1.8rem;
    margin-top: 60px;
    margin-bottom: 30px;
}

.options {
    display: flex;
    justify-content: space-around;
    gap: 10px;
    flex-wrap: wrap;
}

.option {
    padding: 15px 20px;
    font-size: 1.3rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #0056b3;
    color: white;
    transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    box-shadow: 0 5px 15px rgba(0, 174, 255, 0.5);
}

.option:hover {
    transform: scale(1.05);
    background: #0099ff;
    box-shadow: 0 5px 25px rgba(0, 174, 255, 0.8);
}

.result {
    font-size: 1.5rem;
    margin-top: 20px;
    display: none;
}

.result.correct {
    color: #00ff99;
    font-size: 2rem;
}

.result.wrong {
    color: #ff4c4c;
    font-size: 2rem;
}

.result-box {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(145deg, #001f3f, #0074D9);
    padding: 40px;
    border-radius: 20px;
    text-align: center;
    box-shadow: 0 8px 25px rgba(0, 255, 255, 0.4), 0 0 50px rgba(0, 174, 255, 0.2);
    z-index: 1000;
    color: white;
    opacity: 0;
    animation: popIn 0.6s ease forwards;
    width: 80%;
    max-width: 500px;
    animation-delay: 0.5s;
}

@keyframes popIn {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.6);
    }
    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

.result-box h1 {
            font-size: 2.2rem;
            margin-bottom: 15px; /* Reduced margin to make it closer to text */
            font-weight: bold;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.6);
        }

.result-box p {
    font-size: 1.5rem;
    margin-bottom: 40px;
    color: #f5f5f5;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 0, 0, 0.4);
}

.restart-button {
    padding: 15px 30px;
    font-size: 1.4rem;
    cursor: pointer;
    background: linear-gradient(145deg, #00A8E8, #0074D9);
    border: none;
    border-radius: 50px;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    position: absolute;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    color: white;
    font-weight: bold;
    box-shadow: 0 5px 20px rgba(0, 174, 255, 0.6);
    outline: none;
    margin-top: 20px;
}

.restart-button:hover {
    background: linear-gradient(145deg, #00c3ff, #008cff);
    transform: translateX(-50%) scale(1.1);
    box-shadow: 0 8px 30px rgba(0, 174, 255, 0.4);
}

.restart-button:focus {
    outline: none;
}
    </style>
</head>
<body>
    <div class="game-container">
        <div class="timer" id="timer">60</div>
        <div class="question" id="question">A father is 45 years old, and his son is 15 years old. In how many years will the father be three times as old as his son?</div>
        <div class="options" id="options">
            <button class="option" onclick="checkAnswer('A')">A. 10</button>
            <button class="option" onclick="checkAnswer('B')">B. 15</button>
            <button class="option" onclick="checkAnswer('C')">C. 25</button>
            <button class="option" onclick="checkAnswer('D')">D. 20</button>
        </div>
        <div class="result" id="result"></div>
        <div class="next-message" id="nextMessage" style="display: none;">Next question loading...</div>
    </div>

    <!-- Result Box -->
    <div class="result-box" id="resultBox">
        <h1 id="resultComment"></h1>
        <p id="finalScore"></p>
        <button class="restart-button" id="restartButton" onclick="restartGame()">Restart</button>
    </div>

    <script>
        const questions = [
            { text: 'A father is 45 years old, and his son is 15 years old. In how many years will the father be two times as old as his son?', correct: 'B', options: ['10', '15', '25', '20'] },
            { text: 'If A is the brother of B and B is the daughter of C, then how is C related to A?', correct: 'B', options: ['Sister', 'Parent', 'Brother', 'uncle'] },
            { text: "John is 5 years older than his brother. If John's age is doubled and reduced by 10, the result is 10 more than his brother's age. How old are they?", correct: 'A', options: ['John: 15, Brother: 10', 'John: 20, Brother: 15', 'John: 25, Brother: 20', 'John: 30, Brother: 25'] },
            { text: "If a person’s son is the brother of his daughter, then what is the person’s relationship to the daughter?", correct: 'A', options: ['Parent', 'Cousin', 'Brother', 'Uncle'] },
            { text: "A man is looking at a picture. He says, 'The father of the person in the picture is my father’s son.' Who is in the picture?", correct: 'C', options: ['Himself', 'His brother', 'His son', 'His father'] },
            { text: 'Pointing to a woman, a man said, "Her son is my son’s uncle." How is the man related to the woman?', correct: 'C', options: ['Cousin', 'Brother', 'Husband', 'Father'] },
            { text: 'A woman gave birth to two daughters and a son. Her son is married, and his wife has a daughter. What is the woman’s relationship to her son’s daughter?', correct: 'D', options: ['Sister', 'Mother', 'Aunt', 'Grandmother'] },
            { text: 'A man is 4 times as old as his daughter. After 20 years, he will be twice as old as her. How old are they now?', correct: 'B', options: ['Man: 60, Daughter: 20', 'Man: 40, Daughter: 10', 'Man: 30, Daughter: 8', 'Man: 50, Daughter: 15'] },
            { text: 'A grandfather is twice as old as his grandson. 20 years ago, the grandfather was three times the grandson’s age. How old are they now?', correct: 'D', options: ['Grandfather: 60, Grandson: 30', 'Grandfather: 90, Grandson: 45', 'Grandfather: 70, Grandson: 35', 'Grandfather: 80, Grandson: 40'] },
            { text: 'A woman gave birth to three children. Each child had two siblings, but only one child has the same mother as the others. How many children does the woman have?', correct: 'C', options: ['1', '2', '3', '4'] },
            { text: 'If my mother’s husband’s brother’s son is my nephew, then how am I related to my mother’s husband?', correct: 'C', options: ['Cousin', 'Son', 'Uncle', 'Brother'] },
            { text: 'In a family, there are two brothers and one sister. Each brother has one sister. How many people are in the family?', correct: 'A', options: ['4', '5', '6', '3'] },
            { text: 'A man’s son is his only child. His son is married to a woman who has two brothers and one sister. What is the man’s relationship to his daughter-in-law’s brothers?', correct: 'D', options: ['Uncle', 'Cousin', 'Brother-in-law', 'Father-in-law'] },
            { text: 'If a man’s brother is the father of a boy, how is the boy related to the man?', correct: 'A', options: ['Nephew', 'Brother', 'Son', 'Cousin'] },
            { text: 'A woman’s father is the brother of her husband’s uncle. What is the relationship between the woman’s father and her husband?', correct: 'C', options: ['Father', 'Cousin', 'Brother-in-law', 'Uncle'] },
            { text: 'A person’s mother has three children: A, B, and C. Who is the third child?', correct: 'B', options: ['B', 'C', 'A', 'You'] },
            { text: 'A man’s son is his only child. The son has a son, and that son has a daughter. What is the man’s relationship to the daughter?', correct: 'A', options: ['Great-grandfather', 'Uncle', 'Cousin', 'Grandfather'] },
            { text: 'A man is married to his cousin. The cousin’s father is the man’s uncle. What is the man’s relationship to his cousin?', correct: 'B', options: ['Uncle', 'Cousin', 'Nephew', 'Brother'] },
            { text: 'A woman says, "My mother’s husband is your son." Who is she speaking to?', correct: 'B', options: ['Her aunt', 'Her mother-in-law', 'Her uncle', 'Her cousin'] },
            { text: 'If your daughter’s father-in-law is your brother, how is your daughter’s father-in-law related to you?', correct: 'D', options: ['Uncle', 'Nephew', 'Cousin', 'Brother'] },
            { text: 'A man is married to a woman who has one daughter. The daughter has a brother. How many children do the man and woman have together?', correct: 'A', options: ['1', '2', '3', '0'] },
            { text: 'A man’s wife has a sister who is married to the man’s cousin. What is the relationship between the man’s wife and the cousin’s wife?', correct: 'C', options: ['Cousins', 'Friends', 'Sisters-in-law', 'Sisters'] },
            { text: ' A person has two sisters. One sister has two children, and the other has none. How many children does the person have?', correct: 'A', options: ['0', '1', '2', '3'] },
            { text: 'A woman is married to a man who is her second cousin. What is the relationship between the woman’s mother and her husband?', correct: 'C', options: ['Sister', 'Mother-in-law', 'Aunt', 'Cousin'] },
            { text: 'In a family, the mother of the father of a child is the grandmother of the child. How is the father of the child related to his mother?', correct: 'A', options: ['Son', 'Uncle', 'Cousin', 'Brother'] },
            ];
        let currentQuestion = 0;
        let score = 0;
        let timeLeft = 60;
        let timer;

        function startTimer() {
            const timerElement = document.getElementById('timer');
            timer = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    timerElement.textContent = timeLeft;
                } else {
                    clearInterval(timer);
                    checkAnswer(null, true); // Trigger timeout action
                }
            }, 1000);
        }

        function loadQuestion() {
            const questionElement = document.getElementById('question');
            const optionsElement = document.getElementById('options');
            const resultElement = document.getElementById('result');
            const nextMessage = document.getElementById('nextMessage');

            const question = questions[currentQuestion];
            questionElement.textContent = question.text;

            resultElement.style.display = 'none';
            nextMessage.style.display = 'none';

            loadOptions(question.options);

            timeLeft = 60;
            startTimer();
        }

        function loadOptions(options) {
            const optionsElement = document.getElementById('options');
            optionsElement.innerHTML = options
                .map((option, index) => `<button class="option" onclick="checkAnswer('${String.fromCharCode(65 + index)}')">${String.fromCharCode(65 + index)}. ${option}</button>`)
                .join('');
        }


        
        function checkAnswer(selected, isTimeout = false) {
            clearInterval(timer);
            const resultElement = document.getElementById('result');
            const nextMessage = document.getElementById('nextMessage');
            const correct = questions[currentQuestion].correct;
        
            if (isTimeout) {
                resultElement.textContent = `Time Up! The correct answer was ${correct}.`;
                resultElement.className = 'result wrong';
            } else if (selected === correct) {
                resultElement.textContent = 'Correct!';
                resultElement.className = 'result correct';
                score++;
            } else {
                resultElement.textContent = `Wrong! The correct answer was ${correct}.`;
                resultElement.className = 'result wrong';
            }
        
            resultElement.style.display = 'block';
            nextMessage.style.display = 'block';
        
            setTimeout(nextQuestion, 3000); // Automatically load the next question
        }
        
        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showFinalResult();
            }
        }
        

        function showFinalResult() {
            const resultBox = document.getElementById('resultBox');
            const resultComment = document.getElementById('resultComment');
            const finalScore = document.getElementById('finalScore');

            let comment;
            if (score === 25) {
                comment = 'You are a god! You scored 25 out of 25!';
            } else if (score > 20) {
                comment = `Amazing! Your score: ${score}`;
            } else if (score >= 15) {
                comment = `You are good! Your score: ${score}`;
            } else if (score >= 10) {
                comment = `Could do better! Your score: ${score}`;
            } else {
                comment = `Better luck next time! Your score: ${score}`;
            }

            resultComment.textContent = comment;
            finalScore.textContent = `Final Score: ${score} / ${questions.length}`;

            resultBox.style.display = 'block';

            // Center restart button initially
            const restartButton = document.getElementById('restartButton');
            restartButton.style.display = 'block';

            setTimeout(() => {
                restartButton.classList.add('restart-left');
            }, 5000);
        }

        function restartGame() {
            score = 0;
            currentQuestion = 0;
            loadQuestion();
            document.getElementById('resultBox').style.display = 'none';
        }

        // Initial call
        loadQuestion();
    </script>
</body>
</html>
