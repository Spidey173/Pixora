<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Game</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            height: 100vh;
            background-color: #001f3f; /* Dark blue background */
            overflow: hidden;
            position: relative;
        }

        /* Cloud container to arrange three clouds per row */
        .cloud-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            width: 80vw;
            height: 60vh;
        }

        .cloud {
            width: 100%;
            height: 250px;
            background-image: url('/static/Games/Crossword/cloud.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
            color:red;
            text-decoration: none;
            text-align: center;
            transition: transform 0.3s;
            margin-top: -20px; /* Moves each cloud 20px higher */
        }
        
        .cloud:hover {
            transform: scale(1.1);
        }

        .snowflake, .raindrop {
            position: absolute;
            background-color: white;
            opacity: 0.7;
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }
        
        .snowflake {
            width: 8px;
            height: 8px;
            animation-duration: 5s;
            top: -10px;
        }
        
        .raindrop {
            width: 2px;
            height: 15px;
            animation-duration: 2s;
            top: -20px;
        }

        /* Animation for snowflakes and raindrops */
        @keyframes fall {
            to {
                transform: translateY(100vh);
                opacity: 0.1;
            }
        }
    </style>

<!-- Pixora Platform SDK v2 Bundle Bridge (Poki / Static CDN Architecture) -->
<script>
(function() {
    'use strict';
    const GAME_SLUG = "crossword";
    const GAME_TITLE = "Neural Crossword";

    // 1. Universal Pixora / Glitch4ce SDK Client
    const PixoraBridge = {
        init: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_HANDSHAKE',
                    payload: { gameId: GAME_SLUG, version: '2.0.0' }
                }, '*');
            }
        },
        gameplayStart: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_GAMEPLAY_START',
                    payload: { game: GAME_TITLE, timestamp: Date.now() }
                }, '*');
            }
        },
        gameplayStop: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_GAMEPLAY_STOP',
                    payload: { game: GAME_TITLE, timestamp: Date.now() }
                }, '*');
            }
        },
        recordAction: function(action) {
            // Track physical player interaction for anti-cheat entropy
        },
        submitScore: function(scoreVal) {
            const num = Math.floor(Number(scoreVal));
            if (isNaN(num) || num < 0) return;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_SUBMIT_SCORE',
                    payload: { game: GAME_TITLE, score: num, timestamp: Date.now() }
                }, '*');
            }
        }
    };

    window.Pixora = window.Pixora || PixoraBridge;
    window.Glitch4ce = window.Glitch4ce || PixoraBridge;

    // Auto-initiate handshake with parent theater shell
    PixoraBridge.init();
    PixoraBridge.gameplayStart();

    // Hook common score end functions
    window.addEventListener('load', function() {
        let _submitted = false;
        function autoSubmit(val) {
            const s = Math.floor(Number(val));
            if (isNaN(s) || s <= 0 || _submitted) return;
            _submitted = true;
            PixoraBridge.submitScore(s);
            setTimeout(() => { _submitted = false; }, 4000);
        }

        ['endGame', 'showResult', 'gameOver', 'showFinalScore', 'checkCompletion'].forEach(fn => {
            if (typeof window[fn] === 'function') {
                const orig = window[fn];
                window[fn] = function(...args) {
                    const res = orig.apply(this, args);
                    const score = window.score || 
                                  (window.player1 ? Math.max(window.player1.score, (window.player2 ? window.player2.score : 0)) * 100 : null) || 
                                  (window.correctAnswers ? window.correctAnswers * 100 : null);
                    if (score) autoSubmit(score);
                    return res;
                };
            }
        });
    });
})();
</script>
</head>
<body>

    <!-- Cloud container with three clouds per row -->
    <div class="cloud-container">
        <a href="crossword movie.html" class="cloud">Movies</a>
        <a href="crossword anime.html" class="cloud">Anime</a>
        <a href="crossword sport.html" class="cloud">Indian Sport Person</a>
        <a href="crossword state.html" class="cloud">States and UI</a>
        <a href="crossword animal.html" class="cloud">Animals</a>
        <a href="crossword cities.html" class="cloud">Cities</a>
    </div>

    <!-- Script to add animated snowflakes and raindrops -->
    <script>
        function createParticles(type, count) {
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add(type);
                particle.style.left = Math.random() * 100 + 'vw';
                particle.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(particle);
            }
        }
        // Add snowflakes and raindrops
        createParticles('snowflake', 50);
        createParticles('raindrop', 30);
    </script>

</body>
</html>
