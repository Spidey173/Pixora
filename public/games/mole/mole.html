<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake the Mole!</title>
    <style>
        /* Updated CSS */
         /* Updated CSS */
         body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #8B4513; /* Brown background */
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        .start-container {
            position: relative;
            z-index: 1;
        }
        
        .game-title {
            font-size: 4rem;
            color: #ff4500;
            text-transform: uppercase;
            font-weight: bolder;
            text-shadow: 3px 3px 8px #000;
            margin-bottom: 20px;
            animation: float 2s ease-in-out infinite, textShine 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes textShine {
            0% { color: #ff4500; }
            50% { color: #ffd700; }
            100% { color: #ff4500; }
        }
        
        .subtitle {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 30px;
            color: #ffd700;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            animation: zoomIn 1s ease forwards;
        }
        
        @keyframes zoomIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .start-btn {
            padding: 15px 30px;
            font-size: 1.5rem;
            background-color: #d35400;
            color: #fff;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s, background-color 0.3s ease;
            animation: heartbeat 1.5s infinite;
        }
        
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .start-btn:hover {
            background-color: #e74c3c;
            transform: scale(1.2);
        }
        
        .start-btn:active {
            transform: scale(0.9);
        }
    </style>

<!-- Pixora Platform SDK v2 Bundle Bridge (Poki / Static CDN Architecture) -->
<script>
(function() {
    'use strict';
    const GAME_SLUG = "mole";
    const GAME_TITLE = "Whack a Mole";

    // 1. Universal Pixora / Glitch4ce SDK Client
    const PixoraBridge = {
        init: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_HANDSHAKE',
                    payload: { gameId: GAME_SLUG, version: '2.0.0' }
                }, '*');
            }
        },
        gameplayStart: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_GAMEPLAY_START',
                    payload: { game: GAME_TITLE, timestamp: Date.now() }
                }, '*');
            }
        },
        gameplayStop: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_GAMEPLAY_STOP',
                    payload: { game: GAME_TITLE, timestamp: Date.now() }
                }, '*');
            }
        },
        recordAction: function(action) {
            // Track physical player interaction for anti-cheat entropy
        },
        submitScore: function(scoreVal) {
            const num = Math.floor(Number(scoreVal));
            if (isNaN(num) || num < 0) return;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_SUBMIT_SCORE',
                    payload: { game: GAME_TITLE, score: num, timestamp: Date.now() }
                }, '*');
            }
        }
    };

    window.Pixora = window.Pixora || PixoraBridge;
    window.Glitch4ce = window.Glitch4ce || PixoraBridge;

    // Auto-initiate handshake with parent theater shell
    PixoraBridge.init();
    PixoraBridge.gameplayStart();

    // Hook common score end functions
    window.addEventListener('load', function() {
        let _submitted = false;
        function autoSubmit(val) {
            const s = Math.floor(Number(val));
            if (isNaN(s) || s <= 0 || _submitted) return;
            _submitted = true;
            PixoraBridge.submitScore(s);
            setTimeout(() => { _submitted = false; }, 4000);
        }

        ['endGame', 'showResult', 'gameOver', 'showFinalScore', 'checkCompletion'].forEach(fn => {
            if (typeof window[fn] === 'function') {
                const orig = window[fn];
                window[fn] = function(...args) {
                    const res = orig.apply(this, args);
                    const score = window.score || 
                                  (window.player1 ? Math.max(window.player1.score, (window.player2 ? window.player2.score : 0)) * 100 : null) || 
                                  (window.correctAnswers ? window.correctAnswers * 100 : null);
                    if (score) autoSubmit(score);
                    return res;
                };
            }
        });
    });
})();
</script>
</head>
<body>
    <div class="start-container">
        <h1 class="game-title">Mole Invasion: Whack Back!</h1>
        <p class="subtitle">Get ready for some mole-smashing action!</p>
        <button class="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <script>
        function startGame() {
            window.location.href = 'mole2nd.html';
        }
    </script>
</body>
</html>
