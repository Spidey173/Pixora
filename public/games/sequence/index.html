<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patterns in Numbers: Unraveling Mathematical Sequences</title>
<style>
    /* Full page styling */
body {
    margin: 0;
    font-family: 'Arial', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: radial-gradient(circle, #6a11cb, #2575fc); /* Cool gradient background */
    color: #fff;
    overflow: hidden;
    animation: gradientAnimation 5s infinite alternate; /* Smooth gradient animation */
}

/* Container to center the content */
.container {
    text-align: center;
    animation: fadeIn 2s ease-in-out; /* Fade-in animation */
}

/* Title styling */
h1 {
    font-size: 4em;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 4px 4px 20px rgba(0, 0, 0, 0.5);
    margin-bottom: 50px;
    background: -webkit-linear-gradient(#ff7e5f, #feb47b); /* Gradient text */
    -webkit-background-clip: text;
    color: transparent;
    animation: textAnimation 3s ease-in-out; /* Animation for the title */
}

/* Button styling */
.start-btn {
    padding: 18px 40px;
    font-size: 1.5em;
    font-weight: bold;
    border: none;
    cursor: pointer;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff7e5f, #feb47b);
    color: white;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: 0 5px 15px rgba(255, 94, 77, 0.6);
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}

/* Hover effects for the button */
.start-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 10px 20px rgba(255, 94, 77, 0.7);
    background: linear-gradient(135deg, #feb47b, #ff7e5f);
}

/* Active button effect */
.start-btn:active {
    transform: scale(1);
    box-shadow: none;
}

/* Gradient animation for the background */
@keyframes gradientAnimation {
    0% {
        background: radial-gradient(circle, #6a11cb, #2575fc);
    }
    100% {
        background: radial-gradient(circle, #2575fc, #6a11cb);
    }
}

/* Text animation for the title */
@keyframes textAnimation {
    0% {
        opacity: 0;
        transform: translateY(-30px);
    }
    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Fade-in animation for the container */
@keyframes fadeIn {
    0% {
        opacity: 0;
    }
    100% {
        opacity: 1;
    }
}

</style>

<!-- Pixora Platform SDK v2 Bundle Bridge (Poki / Static CDN Architecture) -->
<script>
(function() {
    'use strict';
    const GAME_SLUG = "sequence";
    const GAME_TITLE = "Sequence Number Logic";

    // 1. Universal Pixora / Glitch4ce SDK Client
    const PixoraBridge = {
        init: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_HANDSHAKE',
                    payload: { gameId: GAME_SLUG, version: '2.0.0' }
                }, '*');
            }
        },
        gameplayStart: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_GAMEPLAY_START',
                    payload: { game: GAME_TITLE, timestamp: Date.now() }
                }, '*');
            }
        },
        gameplayStop: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_GAMEPLAY_STOP',
                    payload: { game: GAME_TITLE, timestamp: Date.now() }
                }, '*');
            }
        },
        recordAction: function(action) {
            // Track physical player interaction for anti-cheat entropy
        },
        submitScore: function(scoreVal) {
            const num = Math.floor(Number(scoreVal));
            if (isNaN(num) || num < 0) return;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_SUBMIT_SCORE',
                    payload: { game: GAME_TITLE, score: num, timestamp: Date.now() }
                }, '*');
            }
        }
    };

    window.Pixora = window.Pixora || PixoraBridge;
    window.Glitch4ce = window.Glitch4ce || PixoraBridge;

    // Auto-initiate handshake with parent theater shell
    PixoraBridge.init();
    PixoraBridge.gameplayStart();

    // Hook common score end functions
    window.addEventListener('load', function() {
        let _submitted = false;
        function autoSubmit(val) {
            const s = Math.floor(Number(val));
            if (isNaN(s) || s <= 0 || _submitted) return;
            _submitted = true;
            PixoraBridge.submitScore(s);
            setTimeout(() => { _submitted = false; }, 4000);
        }

        ['endGame', 'showResult', 'gameOver', 'showFinalScore', 'checkCompletion'].forEach(fn => {
            if (typeof window[fn] === 'function') {
                const orig = window[fn];
                window[fn] = function(...args) {
                    const res = orig.apply(this, args);
                    const score = window.score || 
                                  (window.player1 ? Math.max(window.player1.score, (window.player2 ? window.player2.score : 0)) * 100 : null) || 
                                  (window.correctAnswers ? window.correctAnswers * 100 : null);
                    if (score) autoSubmit(score);
                    return res;
                };
            }
        });
    });
})();
</script>
</head>
<body>
    <div class="container">
        <h1>Patterns in Numbers: Unraveling Mathematical Sequences</h1>
        <a href="mathsequencegame.html">
            <button class="start-btn">Start Game</button>
        </a>
    </div>
</body>
</html>
