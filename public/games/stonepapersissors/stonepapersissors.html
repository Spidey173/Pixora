<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stone, Paper, Scissors</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins&display=swap');
    body {
      background: #2d2a3d;
      color: #fff;
      font-family: "Poppins";
    }
    .message {
      margin: 5em 0 2em;
      text-align: center;
    }
    .images {
      display: flex;
      justify-content: space-around;
      align-items: center;
      text-align: center;
      height: 200px;
    }
    .computer img,
    .player img {
      width: 75%;
    }
    .points {
      margin: 2em 0;
      text-align: center;
    }
    .options {
      margin-top: 5em;
      display: flex;
      justify-content: space-around;
    }
    .options img {
      width: 150px;
      cursor: pointer;
      border: 1px solid #fff;
      border-radius: 7px;
      padding: 1em;
      transition: 0.2s all linear;
    }
    .options img:hover {
      background-color: darkcyan;
      border: 1px solid darkcyan;
    }
    @keyframes shakeComputer {
      0% { transform: rotate(-30deg); }
      25% { transform: rotate(30deg); }
      50% { transform: rotate(-30deg); }
      75% { transform: rotate(30deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes shakePlayer {
      0% { transform: rotate(30deg); }
      25% { transform: rotate(-30deg); }
      50% { transform: rotate(30deg); }
      75% { transform: rotate(-30deg); }
      100% { transform: rotate(0deg); }
    }
    .shakeComputer {
      animation: shakeComputer 0.8s linear;
    }
    .shakePlayer {
      animation: shakePlayer 0.8s linear;
    }
        .result {
      font-size: 1.5em;
      margin: 1em 0;
      font-weight: bold;
      text-align: center;
    }

  </style>

<!-- Pixora Platform SDK v2 Bundle Bridge (Poki / Static CDN Architecture) -->
<script>
(function() {
    'use strict';
    const GAME_SLUG = "stonepapersissors";
    const GAME_TITLE = "Stone Paper Scissors";

    // 1. Universal Pixora / Glitch4ce SDK Client
    const PixoraBridge = {
        init: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_HANDSHAKE',
                    payload: { gameId: GAME_SLUG, version: '2.0.0' }
                }, '*');
            }
        },
        gameplayStart: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_GAMEPLAY_START',
                    payload: { game: GAME_TITLE, timestamp: Date.now() }
                }, '*');
            }
        },
        gameplayStop: function() {
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_GAMEPLAY_STOP',
                    payload: { game: GAME_TITLE, timestamp: Date.now() }
                }, '*');
            }
        },
        recordAction: function(action) {
            // Track physical player interaction for anti-cheat entropy
        },
        submitScore: function(scoreVal) {
            const num = Math.floor(Number(scoreVal));
            if (isNaN(num) || num < 0) return;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    source: 'PIXORA_GAME_CLIENT',
                    type: 'PIXORA_SUBMIT_SCORE',
                    payload: { game: GAME_TITLE, score: num, timestamp: Date.now() }
                }, '*');
            }
        }
    };

    window.Pixora = window.Pixora || PixoraBridge;
    window.Glitch4ce = window.Glitch4ce || PixoraBridge;

    // Auto-initiate handshake with parent theater shell
    PixoraBridge.init();
    PixoraBridge.gameplayStart();

    // Hook common score end functions
    window.addEventListener('load', function() {
        let _submitted = false;
        function autoSubmit(val) {
            const s = Math.floor(Number(val));
            if (isNaN(s) || s <= 0 || _submitted) return;
            _submitted = true;
            PixoraBridge.submitScore(s);
            setTimeout(() => { _submitted = false; }, 4000);
        }

        ['endGame', 'showResult', 'gameOver', 'showFinalScore', 'checkCompletion'].forEach(fn => {
            if (typeof window[fn] === 'function') {
                const orig = window[fn];
                window[fn] = function(...args) {
                    const res = orig.apply(this, args);
                    const score = window.score || 
                                  (window.player1 ? Math.max(window.player1.score, (window.player2 ? window.player2.score : 0)) * 100 : null) || 
                                  (window.correctAnswers ? window.correctAnswers * 100 : null);
                    if (score) autoSubmit(score);
                    return res;
                };
            }
        });
    });
})();
</script>
</head>
<body>
  <div class="container">
    <div class="message">CHOOSE AN OPTION</div>
    <div class="images">
      <div class="computer">
        <!-- Initial computer image -->
        <img src="stoneComputer.png" alt="Computer Choice" />
      </div>
      <div class="player">
        <!-- Initial player image -->
        <img src="stonePlayer.png" alt="Player Choice" />
      </div>
    </div>
    <div class="points">
      COMPUTER <span class="computerPoints">0</span> /
      <span class="playerPoints">0</span> PLAYER
    </div>
        <div class="result" id="resultMessage"></div>

    <div class="options">
      <!-- Replace these src attributes with your own images if needed -->
      <img src="stonePlayer.png" alt="STONE" data-choice="STONE" />
      <img src="paperPlayer.png" alt="PAPER" data-choice="PAPER" />
      <img src="scissorsPlayer.png" alt="SCISSORS" data-choice="SCISSORS" />
    </div>
  </div>
  <script>
    const computer = document.querySelector(".computer img");
    const player = document.querySelector(".player img");
    const computerPoints = document.querySelector(".computerPoints");
    const playerPoints = document.querySelector(".playerPoints");
    const options = document.querySelectorAll(".options img");

    options.forEach((option) => {
      option.addEventListener("click", () => {
        computer.classList.add("shakeComputer");
        player.classList.add("shakePlayer");

        setTimeout(() => {
          computer.classList.remove("shakeComputer");
          player.classList.remove("shakePlayer");

          // Get player's choice from the data attribute
          const playerChoice = option.getAttribute("data-choice");
          // Updated image source directly from bundle
          player.src = playerChoice.toLowerCase() + "Player.png";

          const choices = ["STONE", "PAPER", "SCISSORS"];
          const randomIndex = Math.floor(Math.random() * 3);
          const computerChoice = choices[randomIndex];
          computer.src = computerChoice.toLowerCase() + "Computer.png";

          let cPoints = parseInt(computerPoints.innerHTML);
          let pPoints = parseInt(playerPoints.innerHTML);

          // Determine winner
          if (playerChoice === computerChoice) {
            resultMessage.textContent = "It's a tie!";
            resultMessage.style.color = "yellow";
          } else if (
            (playerChoice === "STONE" && computerChoice === "SCISSORS") ||
            (playerChoice === "PAPER" && computerChoice === "STONE") ||
            (playerChoice === "SCISSORS" && computerChoice === "PAPER")
          ) {
            playerPoints.innerHTML = pPoints + 1;
            resultMessage.textContent = "Player wins this round! ✅";
            resultMessage.style.color = "green";
          } else {
            computerPoints.innerHTML = cPoints + 1;
            resultMessage.textContent = "Computer wins this round! ❌";
            resultMessage.style.color = "red";
          }
        }, 900);
      });
    });
  </script>
</body>
</html>
