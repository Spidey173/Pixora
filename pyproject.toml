[project]
name = "pixora"
version = "2.0.0"
description = "Pixora Retro Arcade Gaming Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0.0,<3.1.0",
    "Flask-SQLAlchemy>=3.1.0,<3.2.0",
    "Flask-Login>=0.6.2,<0.7.0",
    "Flask-WTF>=1.1.0,<1.3.0",
    "Flask-Migrate>=4.0.0,<4.2.0",
    "Flask-Limiter>=3.5.0,<3.6.0",
    "Flask-Bcrypt>=1.0.0,<1.1.0",
    "Werkzeug>=3.0.0,<3.2.0",
    "SQLAlchemy>=2.0.0,<2.1.0",
    "WTForms>=3.0.0,<3.2.0",
    "python-dotenv>=1.0.0,<1.1.0",
    "boto3>=1.34.0",
    "redis>=5.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501", # Line length handled by formatter
    "W291", # Trailing whitespace
    "W292", # No newline at end of file
    "W293", # Blank line contains whitespace
]
