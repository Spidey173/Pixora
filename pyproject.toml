[project]
name = "pixora"
version = "2.0.0"
description = "Pixora Retro Arcade Gaming Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "SQLAlchemy>=2.0.0,<2.1.0",
    "itsdangerous>=2.1.0",
    "jinja2>=3.1.0",
    "markupsafe>=2.1.0",
    "bcrypt>=4.1.0",
    "python-dotenv>=1.0.0,<1.1.0",
    "boto3>=1.34.0",
    "redis>=5.0.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "websockets>=12.0",
    "httpx>=0.27.0",
    "werkzeug>=3.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501", # Line length handled by formatter
    "W291", # Trailing whitespace
    "W292", # No newline at end of file
    "W293", # Blank line contains whitespace
]
